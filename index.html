<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corbett Road · Pitch Studio</title>

  <!-- React + ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --ink: #0b1828;
      --ink-soft: #18324d;
      --parchment: #f4ecdc;
      --parchment-dim: #e9dfc7;
      --cream: #fbf6ea;
      --gold: #b8893a;
      --gold-soft: #d6a85a;
      --accent: #8b1e1e;
      --rule: rgba(11, 24, 40, 0.12);
    }

    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-display {
      font-family: 'Fraunces', Georgia, serif;
      font-feature-settings: "ss01", "ss02";
      letter-spacing: -0.02em;
    }

    .font-mono {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
    }

    /* Subtle paper texture */
    .paper-bg {
      background-color: var(--cream);
      background-image:
        radial-gradient(at 20% 10%, rgba(184, 137, 58, 0.06) 0px, transparent 50%),
        radial-gradient(at 80% 90%, rgba(11, 24, 40, 0.04) 0px, transparent 50%);
    }

    .ink-bg {
      background: var(--ink);
      color: var(--parchment);
    }

    .gold-rule {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }

    .btn-primary {
      background: var(--ink);
      color: var(--parchment);
      transition: all 0.2s ease;
      border: 1px solid var(--ink);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--ink-soft);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(11, 24, 40, 0.18);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--rule);
      transition: all 0.2s ease;
    }
    .btn-ghost:hover {
      background: rgba(11, 24, 40, 0.04);
      border-color: var(--ink);
    }

    .btn-gold {
      background: var(--gold);
      color: var(--cream);
      border: 1px solid var(--gold);
      transition: all 0.2s ease;
    }
    .btn-gold:hover:not(:disabled) {
      background: var(--gold-soft);
      transform: translateY(-1px);
    }

    .input-field {
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--rule);
      color: var(--ink);
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--ink);
      background: white;
    }

    .card {
      background: white;
      border: 1px solid var(--rule);
      border-radius: 4px;
    }

    .card-warm {
      background: var(--parchment);
      border: 1px solid rgba(184, 137, 58, 0.2);
      border-radius: 4px;
    }

    /* Pulsing mic indicator */
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: pulse-ring 1.5s ease-out infinite;
    }
    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: pulse-ring 1.5s ease-out 0.5s infinite;
    }

    /* Speaking waveform */
    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    .wave-bar {
      animation: wave 0.8s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; }

    /* Reveal animation */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up {
      animation: fade-up 0.4s ease-out both;
    }

    /* Score bar animation */
    @keyframes fill-bar {
      from { width: 0; }
    }
    .score-bar-fill {
      animation: fill-bar 1s ease-out;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(11,24,40,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(11,24,40,0.4); }

    /* Mode toggle */
    .mode-toggle {
      background: rgba(11, 24, 40, 0.06);
      border-radius: 999px;
      padding: 4px;
      display: inline-flex;
    }
    .mode-toggle button {
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      color: var(--ink);
      background: transparent;
    }
    .mode-toggle button.active {
      background: var(--ink);
      color: var(--parchment);
    }
  </style>
</head>
<body>

    const SUPABASE_URL = "https://gaiafozfuognlfuuegbt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rvsKDJY80LR8vJwpYRs6SA__WulvQBW";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

    const buildProspectSystemPrompt = (persona) => `You are role-playing as a prospective wealth management client meeting a financial advisor from Corbett Road Wealth Management for the first time. You are evaluating whether to hire them.

YOUR CHARACTER DETAILS:
- Name: ${persona.name || "[invent a realistic name]"}
- Age: ${persona.age || "[invent — typically 45–70]"}
- Retirement timeframe: ${persona.retirement || "[invent]"}
- What you want in retirement: ${persona.retirementGoals || "[invent realistic lifestyle goals]"}
- Current investment strategies: ${persona.currentStrategies || "[invent — e.g. 401k, some individual stocks, savings account]"}
- Primary financial goal: ${persona.primaryGoal || "[invent]"}
- Investing comfort level: ${persona.comfortLevel || "[invent — conservative, moderate, or aggressive]"}
- Estimated time before pulling money from savings: ${persona.pullTime || "[invent]"}
- Current monthly savings: ${persona.monthlySavings || "[invent realistic figure]"}
- Current household income: ${persona.income || "[invent realistic figure]"}
- Current investable assets: ${persona.assets || "[invent realistic figure]"}

ADDITIONAL CONTEXT FROM USER (if any): ${persona.notes || "(none)"}

CRITICAL RULES — READ CAREFULLY:
1. Stay in character as this prospect at all times. Never break character. Never mention you are an AI.
2. Do NOT coach the advisor. Do NOT provide feedback. You are the prospect, not a coach.
3. Fill in gaps in your background by inventing realistic, consistent details as needed. Remember what you've said and stay consistent.
4. Speak naturally. Keep responses concise — usually 1–3 sentences. This is a real conversation.
5. Be a realistic prospect: ask questions, raise concerns, occasionally push back, occasionally reveal something. Don't make it too easy. Don't make it impossible.
6. You started this meeting because you're considering switching wealth managers (or hiring one for the first time). Be open but appropriately skeptical.
7. Use natural speech patterns — fillers, hesitations, "yeah", "well", "honestly" — like a real person speaking out loud. Avoid lists and bullet points.
8. If the advisor asks something you wouldn't reasonably know, say so naturally ("I'd have to check on that").
9. When the advisor thanks you and asks for feedback, that signals the end. Do NOT switch into coach mode — the system will handle the report card separately.
10. Never use markdown formatting. Just speak.

Begin the conversation as the prospect. Wait for the advisor to start, then respond naturally.`;

    const buildCoachSystemPrompt = () => `You are a senior sales coach observing a financial advisor's pitch to a prospect in real time. Your job is to suggest what an EXPERT advisor would say next, based on what the prospect just said.

Use SPIN selling principles (Situation, Problem, Implication, Need-Payoff) and consultative sales best practices. Reward:
- Asking discovery questions before pitching
- Uncovering implications and emotional drivers
- Building rapport before solutioning
- Avoiding jargon and pressure tactics
- Tying solutions to the prospect's specific stated concerns

Provide a brief, specific, conversational suggestion of what the advisor should say next. 2–3 sentences max. Sound natural, not scripted. Do not use markdown. Do not preface with "You should..." — just give the actual words.`;

    const buildGraderSystemPrompt = (persona, transcript) => `You are a senior sales coach reviewing a financial advisor's pitch to a prospective wealth management client. Score the pitch and provide evidence-based feedback.

PROSPECT PROFILE:
${JSON.stringify(persona, null, 2)}

FULL TRANSCRIPT:
${transcript}

Score the advisor 1–10 in each of these 7 categories. For each score, cite a SPECIFIC moment from the transcript as evidence (quote a phrase or describe what was said/missed). Be honest — most real pitches score 5–7. Reserve 9–10 for genuine excellence.

Categories:
1. Meeting Introduction — Did the advisor open warmly, set the agenda, and establish credibility?
2. Profiling the Prospect — Did the advisor ask thoughtful situation questions to understand the prospect's life, goals, family, work?
3. Uncovering and Identifying Key Problems/Concerns — Did the advisor surface the prospect's real worries, gaps, or motivations?
4. Reviewing the Implications of the Problems/Concerns — Did the advisor explore what those problems would mean if unaddressed (financial, emotional, family impact)?
5. Providing a Clear Solution(s) or Offer(s) — Did the advisor connect Corbett Road's services to the prospect's specific stated concerns?
6. Giving the Prospect a Call To Action and Actionable Next Steps — Did the advisor ask for a concrete commitment or next step?
7. Meeting Wrap-Up — Did the advisor close professionally, summarize, and leave the door open?

Also provide qualitative feedback on:
- Cadence
- Conversational flow
- Format
- Knowledge demonstrated
- Referencing specific client concerns/objections
- Building rapport
- Confidence
- Delivery

Return ONLY valid JSON in this exact shape (no markdown, no commentary outside JSON):
{
  "scores": {
    "meeting_introduction":         { "score": 0, "evidence": "", "reasoning": "" },
    "profiling":                    { "score": 0, "evidence": "", "reasoning": "" },
    "uncovering_problems":          { "score": 0, "evidence": "", "reasoning": "" },
    "reviewing_implications":       { "score": 0, "evidence": "", "reasoning": "" },
    "providing_solutions":          { "score": 0, "evidence": "", "reasoning": "" },
    "call_to_action":               { "score": 0, "evidence": "", "reasoning": "" },

  },
  "qualitative": {
    "cadence":              "",
    "conversational_flow":  "",
    "format":               "",
    "knowledge":            "",
    "referencing_concerns": "",
    "rapport":              "",
    "confidence":           "",
    "delivery":             ""
  },
  "summary": "2–4 sentence overall assessment. Honest, professional, succinct.",
  "top_strengths": ["", "", ""],
  "top_growth_areas": ["", "", ""]
}`;

    const buildPersonaGenPrompt = () => `Generate a realistic prospective wealth management client for a financial advisor training simulation. The prospect should be a believable real person with a coherent financial situation. Vary the profile (don't always pick a tech executive). Mix in business owners, dual-income professionals, recent inheritors, pre-retirees, divorcees, etc.

Return ONLY valid JSON in this exact shape (no commentary):
{
  "name": "First Last",
  "age": "number as string",
  "retirement": "e.g. 'about 8 years' or 'already retired 2 years' ",
  "retirementGoals": "what they want to do — 1 sentence",
  "currentStrategies": "what they're currently invested in — 1 sentence",
  "primaryGoal": "their main financial priority — 1 sentence",
  "comfortLevel": "Conservative | Moderate | Aggressive — with one phrase of color",
  "pullTime": "when they'd start drawing — short phrase",
  "monthlySavings": "$X,XXX",
  "income": "$XXX,XXX",
  "assets": "$X,XXX,XXX",
  "notes": "1–2 sentences of life context — family, occupation, recent event, mood about money"
}`;

    // ======================================================================
    // GROQ API HELPER
    // ======================================================================

    async function callGroq({ apiKey, model, messages, temperature = 0.7, jsonMode = false }) {
      const body = {
        model,
        messages,
        temperature,
      };
      if (jsonMode) {
        body.response_format = { type: "json_object" };
      }

      const res = await fetch(GROQ_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`,
        },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }

      const data = await res.json();
      return data.choices?.[0]?.message?.content || "";
    }

    // ======================================================================
    // STORAGE HELPERS
    // ======================================================================

    const STORAGE_KEYS = {
      apiKey: "crpt_groq_key",
      user: "crpt_user",
      reports: "crpt_reports",
      preferredVoice: "crpt_voice",
      chromeConfirmed: "crpt_chrome_confirmed",
      passcodeHash: "crpt_passcode_hash",
      registeredEmail: "crpt_registered_email",
      migrationComplete: "crpt_migration_complete",
    };

    const storage = {
      get: (k, fallback = null) => {
        try {
          const v = localStorage.getItem(k);
          return v == null ? fallback : JSON.parse(v);
        } catch {
          return fallback;
        }
      },
      set: (k, v) => {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) { console.error("Storage failed", e); }
      },
      remove: (k) => localStorage.removeItem(k),
    };

    // ======================================================================
    // SUPABASE DATA LAYER — cloud reads/writes for reports + profiles
    // ======================================================================

    // Convert a Supabase auth user into the shape our app uses
    function toAppUser(sbUser) {
      const email = sbUser.email || "";
      return {
        id: sbUser.id,
        email,
        name: nameFromEmailLocal(email),
      };
    }

    function nameFromEmailLocal(email) {
      if (!email) return "Advisor";
      return email.split("@")[0]
        .split(/[._\-]/)
        .filter(Boolean)
        .map(s => s[0].toUpperCase() + s.slice(1))
        .join(" ");
    }

    // Fetch the current user's report cards from cloud
    async function fetchUserReports(userId) {
      const { data, error } = await sb
        .from("report_cards")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", { ascending: false });
      if (error) throw error;
      return (data || []).map(rowToReport);
    }

    // Fetch all team profiles
    async function fetchAllProfiles() {
      const { data, error } = await sb
        .from("profiles")
        .select("*")
        .order("created_at", { ascending: true });
      if (error) throw error;
      return data || [];
    }

    // Fetch ALL report cards across the team (used by My Team view)
    async function fetchAllReports() {
      const { data, error } = await sb
        .from("report_cards")
        .select("*")
        .order("created_at", { ascending: false });
      if (error) throw error;
      return (data || []).map(rowToReport);
    }

    // Save a report card to the cloud
    async function saveReportToCloud(userId, report) {
      const row = {
        user_id: userId,
        mode: report.mode,
        persona: report.persona || null,
        transcript: report.transcript || [],
        card: report.card || null,
        created_at: new Date(report.createdAt || Date.now()).toISOString(),
      };
      const { error } = await sb.from("report_cards").insert(row);
      if (error) throw error;
    }

    // Convert a database row into our app's report shape
    function rowToReport(row) {
      return {
        id: row.id,
        userId: row.user_id,
        mode: row.mode,
        persona: row.persona,
        transcript: row.transcript || [],
        card: row.card,
        createdAt: new Date(row.created_at).getTime(),
      };
    }

    // Migrate any pre-Supabase localStorage reports to the cloud (one-time)
    async function migrateLocalReportsIfNeeded(userId) {
      if (storage.get(STORAGE_KEYS.migrationComplete)) return;
      const local = storage.get(STORAGE_KEYS.reports, []);
      if (!Array.isArray(local) || local.length === 0) {
        storage.set(STORAGE_KEYS.migrationComplete, true);
        return;
      }
      console.log(`Migrating ${local.length} local reports to cloud...`);
      let migrated = 0;
      for (const r of local) {
        try {
          await saveReportToCloud(userId, r);
          migrated++;
        } catch (e) {
          console.warn("Failed to migrate one report:", e);
        }
      }
      storage.set(STORAGE_KEYS.migrationComplete, true);
      console.log(`Migration complete: ${migrated}/${local.length} reports.`);
    }

    // ======================================================================
    // VOICE HELPERS — Web Speech API
    // ======================================================================

    function getSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      return rec;
    }

    function getBestVoice(preferredName) {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;
      if (preferredName) {
        const match = voices.find(v => v.name === preferredName);
        if (match) return match;
      }
      // Prefer a natural-sounding English voice; weight Google voices first
      const en = voices.filter(v => v.lang.startsWith("en"));
      const preferred = en.find(v => /Google US English/i.test(v.name)) ||
                        en.find(v => /Microsoft.*(Aria|Jenny|Guy|Davis|Tony)/i.test(v.name)) ||
                        en.find(v => /Samantha|Alex|Daniel|Karen/i.test(v.name)) ||
                        en[0];
      return preferred || voices[0];
    }

    function speak({ text, voice, onStart, onEnd }) {
      return new Promise((resolve) => {
        if (!text || !text.trim()) { resolve(); return; }
        const utter = new SpeechSynthesisUtterance(text);
        if (voice) utter.voice = voice;
        utter.rate = 1.0;
        utter.pitch = 1.0;
        utter.onstart = () => { if (onStart) onStart(); };
        utter.onend = () => { if (onEnd) onEnd(); resolve(); };
        utter.onerror = () => { if (onEnd) onEnd(); resolve(); };
        window.speechSynthesis.speak(utter);
      });
    }

    function stopSpeaking() {
      try { window.speechSynthesis.cancel(); } catch {}
    }

    // ======================================================================
    // BROWSER DETECTION
    // ======================================================================

    function detectBrowser() {
      const ua = navigator.userAgent;
      // Order matters — Edge & Opera both contain "Chrome" in UA, so check them first
      if (/Edg\//.test(ua)) return "Edge";
      if (/OPR\//.test(ua) || /Opera/.test(ua)) return "Opera";
      if (/Brave/.test(ua) || (navigator.brave && navigator.brave.isBrave)) return "Brave";
      if (/Firefox\//.test(ua)) return "Firefox";
      if (/Chrome\//.test(ua)) return "Chrome";
      if (/Safari\//.test(ua)) return "Safari";
      return "an unsupported browser";
    }

    // ======================================================================
    // PASSCODE HASHING & NAME HELPERS
    // ======================================================================

    async function hashPasscode(email, passcode) {
      const data = new TextEncoder().encode(`${email.toLowerCase()}:${passcode}`);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function nameFromEmail(email) {
      return email.split("@")[0]
        .split(/[._\-]/)
        .filter(Boolean)
        .map(s => s[0].toUpperCase() + s.slice(1))
        .join(" ");
    }

    const Logo = ({ className = "" }) => (

    const TopNav = ({ user, onSignOut, onNavigate, currentView }) => (
      <header className="border-b" style={{ borderColor: "var(--rule)" }}>

          </button>

            <button
              onClick={() => onNavigate("dashboard")}

            >

            </button>
            <button
              onClick={() => onNavigate("history")}
              className={`uppercase tracking-[0.18em] text-xs ${currentView === "history" ? "text-[var(--ink)]" : "text-[var(--ink)]/60 hover:text-[var(--ink)]"}`}
            >
              Report Cards
            </button>
            <button
              onClick={() => onNavigate("team")}
              className={`uppercase tracking-[0.18em] text-xs ${currentView === "team" ? "text-[var(--ink)]" : "text-[var(--ink)]/60 hover:text-[var(--ink)]"}`}
            >
              My Team
            </button>
            <button
              onClick={() => onNavigate("settings")}
              className={`uppercase tracking-[0.18em] text-xs ${currentView === "settings" ? "text-[var(--ink)]" : "text-[var(--ink)]/60 hover:text-[var(--ink)]"}`}
            >
              Settings
            </button>

    function LoginView({ onSignIn }) {
      const [step, setStep] = useState("email"); // "email" | "signin" | "signup"
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState("");
      const [info, setInfo] = useState("");
      const [busy, setBusy] = useState(false);

      const submitEmail = async (e) => {
        e.preventDefault();
        setError(""); setInfo("");
        const trimmed = email.trim().toLowerCase();
        if (!trimmed) { setError("Please enter your email."); return; }
        if (!trimmed.includes("@") || !trimmed.endsWith("@" + COMPANY_DOMAIN)) {
          setError(`Use your @${COMPANY_DOMAIN} email address.`);
          return;
        }
        setEmail(trimmed);

        // Check if a previous (pre-Supabase) registration exists locally for this email
        // → if so, this is a returning user we want to sign in
        // → otherwise show signup
        const previouslyRegistered = storage.get(STORAGE_KEYS.registeredEmail);
        if (previouslyRegistered && previouslyRegistered.toLowerCase() === trimmed) {
          setInfo("Welcome back. We've upgraded the app — please sign in or create an account if you haven't already.");
        }
        // Always show signin first for returning users; they can switch to signup if needed
        setStep("signin");
      };

      const submitSignIn = async (e) => {
        e.preventDefault();
        setError(""); setInfo("");
        if (!password) { setError("Enter your password."); return; }
        setBusy(true);
        try {
          const { data, error: authError } = await sb.auth.signInWithPassword({
            email,
            password,
          });
          if (authError) {
            // Friendly error messages
            if (/Invalid login credentials/i.test(authError.message)) {
              setError("Email or password is incorrect. If you haven't created an account yet, click 'Create new account' below.");
            } else {
              setError(authError.message);
            }
            setBusy(false);
            return;
          }
          // Supabase auth state listener in App will handle the actual sign-in
          // We just don't do anything else here — the listener takes over
        } catch (err) {
          setError("Something went wrong. Please try again.");
          setBusy(false);
        }
      };

      const submitSignUp = async (e) => {
        e.preventDefault();
        setError(""); setInfo("");
        if (password.length < 6) { setError("Password must be at least 6 characters."); return; }
        if (password !== confirmPassword) { setError("Passwords don't match."); return; }
        setBusy(true);
        try {
          const { data, error: authError } = await sb.auth.signUp({
            email,
            password,
          });
          if (authError) {
            if (/already registered/i.test(authError.message) || /already been registered/i.test(authError.message)) {
              setError("An account already exists for this email. Click 'Sign in instead' below.");
            } else {
              setError(authError.message);
            }
            setBusy(false);
            return;
          }
          // App's auth listener will pick up the new session and route the user forward
        } catch (err) {
          setError("Something went wrong. Please try again.");
          setBusy(false);
        }
      };

      const editEmail = () => {
        setStep("email");
        setPassword(""); setConfirmPassword("");
        setError(""); setInfo("");
      };

      const switchToSignUp = () => {
        setStep("signup");
        setPassword(""); setConfirmPassword("");
        setError(""); setInfo("");
      };

      const switchToSignIn = () => {
        setStep("signin");
        setPassword(""); setConfirmPassword("");
        setError(""); setInfo("");
      };

      return (
        <div className="min-h-screen paper-bg flex">

            <Logo className="text-[var(--parchment)]" />
            <div className="relative z-10">

              <p className="text-[var(--parchment)]/70 max-w-md text-sm leading-relaxed">
                A private practice studio for rehearsing the consultative pitch — built around our seven-step pitch framework, with on-demand AI prospects and instant report cards.
              </p>
            </div>
            <div className="text-[10px] uppercase tracking-[0.3em] text-[var(--parchment)]/30">
              Corbett Road Wealth Management
            </div>
          </div>

          {/* Right panel — content depends on step */}
          <div className="w-full md:w-1/2 flex items-center justify-center p-8">
            <div className="w-full max-w-sm fade-up" key={step}>
              <div className="md:hidden mb-12"><Logo /></div>

              {/* ===== Step 1: Email entry ===== */}
              {step === "email" && (
                <>
                  <div className="text-xs uppercase tracking-[0.25em] text-[var(--ink)]/50 mb-3">Sign in</div>
                  <h2 className="font-display text-3xl mb-2">Welcome.</h2>
                  <p className="text-sm text-[var(--ink)]/60 mb-10">Enter your company email to continue.</p>

                  <form onSubmit={submitEmail} className="space-y-5">
                    <div>
                      <label className="block text-xs uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-2">Company email</label>
                      <input

                      />

                    {error && (
                      <div className="text-xs text-[var(--accent)] flex items-start gap-2">

              {/* ===== Step 2A: Sign in ===== */}

                  {info && (

                  )}

                  <form onSubmit={submitSignIn} className="space-y-5">
                    <div>
                      <label className="block text-xs uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-2">Password</label>
                      <div className="relative">
                        <input
                          type={showPassword ? "text" : "password"}

                          className="input-field w-full px-4 py-3 pr-16 rounded text-sm"

                        />
                        <button

                    </div>
                    {error && (
                      <div className="text-xs text-[var(--accent)] flex items-start gap-2">
                        <span>•</span><span>{error}</span>
                      </div>

                    <button type="submit" disabled={busy} className="btn-primary w-full px-6 py-3 rounded text-sm uppercase tracking-[0.18em]">

                    </button>

                </>

              {/* ===== Step 2B: Sign up ===== */}
              {step === "signup" && (
                <>

                  </p>

                  <p className="text-sm text-[var(--ink)]/70 mb-6 leading-relaxed">

                  </p>

                  <form onSubmit={submitSignUp} className="space-y-5">
                    <div>
                      <label className="block text-xs uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-2">Create password</label>
                      <div className="relative">
                        <input
                          type={showPassword ? "text" : "password"}
                          value={password}
                          onChange={e => { setPassword(e.target.value); setError(""); }}
                          placeholder="At least 6 characters"
                          className="input-field w-full px-4 py-3 pr-16 rounded text-sm"
                          autoFocus
                        />
                        <button

                          onClick={() => setShowPassword(s => !s)}

                          {showPassword ? "Hide" : "Show"}

                      <label className="block text-xs uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-2">Confirm password</label>
                      <input
                        type={showPassword ? "text" : "password"}

                      <div className="text-xs text-[var(--accent)] flex items-start gap-2">
                        <span>•</span><span>{error}</span>
                      </div>

    // ======================================================================
    // LIVE SESSION VIEW (the heart of the app)
    // ======================================================================

    function SessionView({ apiKey, mode, persona, voice, onComplete, onCancel }) {
      const [transcript, setTranscript] = useState([]); // { role: 'advisor'|'prospect', text, ts }
      const [interimText, setInterimText] = useState("");
      const [isListening, setIsListening] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isThinking, setIsThinking] = useState(false);
      const [coachSuggestion, setCoachSuggestion] = useState("");
      const [coachLoading, setCoachLoading] = useState(false);
      const [error, setError] = useState("");
      const [sessionStartedAt] = useState(Date.now());
      const [elapsed, setElapsed] = useState(0);

      const recRef = useRef(null);
      const transcriptRef = useRef(transcript);
      const transcriptScrollRef = useRef(null);
      const finalSegmentsRef = useRef([]); // accumulating final segments before sending
      const silenceTimerRef = useRef(null);
      const isSpeakingRef = useRef(false);
      const isListeningRef = useRef(false);
      const personaRef = useRef(persona);
      const apiKeyRef = useRef(apiKey);
      const modeRef = useRef(mode);
      const voiceRef = useRef(voice);

      useEffect(() => { transcriptRef.current = transcript; }, [transcript]);
      useEffect(() => { isListeningRef.current = isListening; }, [isListening]);
      useEffect(() => { personaRef.current = persona; }, [persona]);
      useEffect(() => { apiKeyRef.current = apiKey; }, [apiKey]);
      useEffect(() => { modeRef.current = mode; }, [mode]);
      useEffect(() => { voiceRef.current = voice; }, [voice]);

      // Elapsed time
      useEffect(() => {
        const t = setInterval(() => setElapsed(Math.floor((Date.now() - sessionStartedAt) / 1000)), 1000);
        return () => clearInterval(t);
      }, [sessionStartedAt]);

      // Auto-scroll transcript
      useEffect(() => {
        if (transcriptScrollRef.current) {
          transcriptScrollRef.current.scrollTop = transcriptScrollRef.current.scrollHeight;
        }
      }, [transcript, interimText]);

      // ---------------- Set up speech recognition ----------------
      useEffect(() => {
        const rec = getSpeechRecognition();
        if (!rec) {
          setError("Your browser doesn't support speech recognition. Please use Chrome or Edge.");
          return;
        }
        recRef.current = rec;

        rec.onresult = (event) => {
          let interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const txt = result[0].transcript;
            if (result.isFinal) {
              finalSegmentsRef.current.push(txt.trim());
              // Reset silence timer on each final segment
              clearTimeout(silenceTimerRef.current);
              silenceTimerRef.current = setTimeout(() => {
                commitAdvisorTurn();
              }, 1400); // 1.4s silence = end of turn
            } else {
              interim += txt;
            }
          }
          setInterimText(interim);
        };

        rec.onerror = (e) => {
          if (e.error === "no-speech" || e.error === "aborted") return;
          if (e.error === "not-allowed") {
            setError("Microphone access denied. Allow mic permission in Chrome and reload.");
          } else {
            console.warn("STT error", e);
          }
        };

        rec.onend = () => {
          // Auto-restart if we're still in listening mode and bot isn't speaking
          if (isListeningRef.current && !isSpeakingRef.current && recRef.current) {
            try { recRef.current.start(); } catch {}
          }
        };

        return () => {
          try { rec.stop(); } catch {}
          clearTimeout(silenceTimerRef.current);
        };
      }, []);

      // Start/stop recognition based on isListening
      useEffect(() => {
        if (!recRef.current) return;
        if (isListening && !isSpeaking) {
          try { recRef.current.start(); } catch {}
        } else {
          try { recRef.current.stop(); } catch {}
        }
      }, [isListening, isSpeaking]);

      // ---------------- Conversation loop ----------------

      const commitAdvisorTurn = useCallback(async () => {
        const segments = finalSegmentsRef.current;
        if (segments.length === 0) return;
        const fullText = segments.join(" ").trim();
        finalSegmentsRef.current = [];
        setInterimText("");
        if (!fullText) return;

        const newTurn = { role: "advisor", text: fullText, ts: Date.now() };
        const updatedTranscript = [...transcriptRef.current, newTurn];
        setTranscript(updatedTranscript);

        await getProspectReply(updatedTranscript);
      }, []);

      const getProspectReply = async (currentTranscript) => {
        setIsThinking(true);
        try {
          const messages = [
            { role: "system", content: buildProspectSystemPrompt(personaRef.current) },
            ...currentTranscript.map(t => ({
              role: t.role === "advisor" ? "user" : "assistant",
              content: t.text,
            })),
          ];

          const reply = await callGroq({
            apiKey: apiKeyRef.current,
            model: MODEL_PROSPECT,
            messages,
            temperature: 0.85,
          });

          const cleaned = reply.replace(/\*+/g, "").trim();
          const newTurn = { role: "prospect", text: cleaned, ts: Date.now() };
          const updated = [...currentTranscript, newTurn];
          setTranscript(updated);
          setIsThinking(false);

          // Speak the reply
          isSpeakingRef.current = true;
          setIsSpeaking(true);
          try { recRef.current?.stop(); } catch {}

          // In practice mode, fetch coach suggestion in parallel
          if (modeRef.current === "practice") {
            getCoachSuggestion(updated);
          }

          await speak({
            text: cleaned,
            voice: getBestVoice(voiceRef.current),
            onEnd: () => {
              isSpeakingRef.current = false;
              setIsSpeaking(false);
            },
          });
        } catch (e) {
          setError("Couldn't reach the AI prospect: " + e.message);

          const recent = currentTranscript.slice(-8).map(t => `${t.role === "advisor" ? "ADVISOR" : "PROSPECT"}: ${t.text}`).join("\n");
          const reply = await callGroq({
            apiKey: apiKeyRef.current,
            model: MODEL_COACH,
            messages: [
              { role: "system", content: buildCoachSystemPrompt() },
              { role: "user", content: `RECENT EXCHANGE:\n${recent}\n\nThe prospect just said: "${lastProspect}"\n\nWhat should the advisor say next? Give the actual words the advisor should say. 2–3 sentences max.` }
            ],
            temperature: 0.6,
          });

    const RUBRIC_KEYS = [
      "meeting_introduction",
      "profiling",
      "uncovering_problems",
      "reviewing_implications",
      "providing_solutions",
      "call_to_action",
      "wrap_up",
    ];

    // Compute per-category averages from a list of report cards
    function computeCategoryAverages(reports) {
      const sums = {}; const counts = {};
      RUBRIC_KEYS.forEach(k => { sums[k] = 0; counts[k] = 0; });
      for (const r of reports) {
        const scores = r.card?.scores;
        if (!scores) continue;
        for (const k of RUBRIC_KEYS) {
          const s = scores[k]?.score;
          if (typeof s === "number" && s > 0) {
            sums[k] += s;
            counts[k] += 1;
          }
        }
      }
      const averages = {};
      for (const k of RUBRIC_KEYS) {
        averages[k] = counts[k] > 0 ? sums[k] / counts[k] : null;
      }
      return averages;
    }

    // Identify strengths (top 3) and growth areas (bottom 3) from averages
    function getStrengthsAndGrowth(averages) {
      const entries = Object.entries(averages).filter(([_, v]) => v !== null);
      if (entries.length === 0) return { strengths: [], growth: [] };
      const sorted = [...entries].sort((a, b) => b[1] - a[1]);
      return {
        strengths: sorted.slice(0, 3).map(([k, v]) => ({ key: k, score: v })),
        growth: sorted.slice(-3).reverse().map(([k, v]) => ({ key: k, score: v })),
      };
    }

    // Pairing algorithm — find the advisor whose strengths best complement my growth areas
    function findBestPairing(myProfile, allTeamData) {
      const candidates = allTeamData.filter(t => t.userId !== myProfile.userId && t.reportCount > 0);
      if (candidates.length === 0) return null;

      let best = null;
      let bestScore = -Infinity;

      for (const candidate of candidates) {
        // Score: how well does candidate's strengths cover my growth areas + vice versa?
        let pairScore = 0;
        for (const myWeakness of myProfile.growth) {
          const theirScore = candidate.averages[myWeakness.key];
          if (theirScore !== null) {
            // The bigger the gap (their score - my score), the better the help
            pairScore += Math.max(0, theirScore - myWeakness.score) * 1.5;
          }
        }
        for (const theirWeakness of candidate.growth) {
          const myScore = myProfile.averages[theirWeakness.key];
          if (myScore !== null) {
            pairScore += Math.max(0, myScore - theirWeakness.score) * 1.5;
          }
        }
        if (pairScore > bestScore) {
          bestScore = pairScore;
          best = candidate;
        }
      }

      return best && bestScore > 0 ? best : (candidates[0] || null);
    }

    function MyTeamView({ currentUser, profiles, allReports, onRefresh }) {
      const [pairing, setPairing] = useState(null);
      const [pairingOpen, setPairingOpen] = useState(false);

      // Build per-advisor stats
      const teamData = useMemo(() => {
        return profiles.map(p => {
          const theirReports = allReports.filter(r => r.userId === p.id);
          const averages = computeCategoryAverages(theirReports);
          const { strengths, growth } = getStrengthsAndGrowth(averages);
          const allScores = Object.values(averages).filter(v => v !== null);
          const overall = allScores.length > 0 ? allScores.reduce((a, b) => a + b, 0) / allScores.length : null;
          return {
            userId: p.id,
            email: p.email,
            name: p.name || nameFromEmailLocal(p.email),
            reportCount: theirReports.length,
            averages,
            strengths,
            growth,
            overall,
            isMe: p.id === currentUser.id,
          };
        });
      }, [profiles, allReports, currentUser.id]);

      const me = teamData.find(t => t.isMe);
      const others = teamData.filter(t => !t.isMe);

      const handlePairMe = () => {
        if (!me || me.reportCount === 0) {
          alert("Complete at least one pitch session before finding a pairing partner.");
          return;
        }
        const match = findBestPairing(me, teamData);
        if (!match) {
          alert("No teammates have completed sessions yet. Encourage someone else to run a pitch!");
          return;
        }
        setPairing({ me, match });
        setPairingOpen(true);
      };

      return (
        <div className="max-w-6xl mx-auto px-8 py-12 fade-up">
          <div className="flex items-end justify-between mb-10 flex-wrap gap-4">
            <div>
              <div className="text-xs uppercase tracking-[0.25em] text-[var(--ink)]/50 mb-2">Team</div>
              <h1 className="font-display text-5xl mb-3 leading-tight">My Team</h1>
              <p className="text-sm text-[var(--ink)]/60 max-w-xl leading-relaxed">
                See where each advisor on the team is strong and where they're growing. Pair up with someone whose strengths cover your weaknesses — and vice versa.
              </p>
            </div>
            <div className="flex gap-3">
              <button onClick={onRefresh} className="btn-ghost px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">

            </div>
          </div>

          {teamData.length === 0 && (
            <div className="card p-12 text-center">
              <div className="font-display text-xl text-[var(--ink)]/50 mb-2">Loading your team…</div>
              <p className="text-sm text-[var(--ink)]/50">If this stays empty, no advisors have signed up yet.</p>
            </div>
          )}

          {/* Your own card highlighted */}
          {me && (
            <div className="mb-6">
              <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-3">You</div>
              <AdvisorCard data={me} highlighted />
            </div>
          )}

          {/* Rest of team */}
          {others.length > 0 && (
            <div>
              <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--ink)]/50 mb-3">Teammates</div>
              <div className="space-y-4">
                {others.map(t => <AdvisorCard key={t.userId} data={t} />)}
              </div>
            </div>
          )}

          {pairingOpen && pairing && (
            <PairingModal pairing={pairing} onClose={() => setPairingOpen(false)} />
          )}
        </div>
      );
    }

    function AdvisorCard({ data, highlighted = false }) {
      const labelFor = (key) => RUBRIC_LABELS[key] || key;

      return (
        <div className={`card p-6 ${highlighted ? "ring-2" : ""}`} style={highlighted ? { boxShadow: "0 0 0 1px var(--gold)" } : {}}>
          <div className="flex items-start justify-between gap-6 flex-wrap">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-3 mb-1">
                <div className="font-display text-xl">{data.name}</div>
                {data.reportCount === 0 && <span className="text-[10px] uppercase tracking-[0.18em] text-[var(--ink)]/40">No sessions yet</span>}
              </div>
              <div className="text-xs text-[var(--ink)]/50 font-mono">{data.email}</div>
            </div>
            <div className="text-right">
              <div className="font-display text-3xl" style={{ color: data.overall ? "var(--gold)" : "var(--ink)" }}>
                {data.overall ? data.overall.toFixed(1) : "—"}
              </div>
              <div className="text-[10px] uppercase tracking-[0.18em] text-[var(--ink)]/50">overall · {data.reportCount} sessions</div>
            </div>
          </div>

          {data.reportCount > 0 && (
            <div className="grid md:grid-cols-2 gap-4 mt-5 pt-5 border-t" style={{ borderColor: "var(--rule)" }}>
              <div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--gold)] mb-2">Strengths</div>
                <ul className="space-y-1.5">
                  {data.strengths.map((s, i) => (
                    <li key={i} className="text-sm flex justify-between gap-3">
                      <span className="text-[var(--ink)]/80">{labelFor(s.key)}</span>
                      <span className="font-display tabular-nums" style={{ color: "var(--gold)" }}>{s.score.toFixed(1)}</span>
                    </li>
                  ))}
                </ul>
              </div>
              <div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--accent)] mb-2">Growth Areas</div>
                <ul className="space-y-1.5">
                  {data.growth.map((s, i) => (
                    <li key={i} className="text-sm flex justify-between gap-3">
                      <span className="text-[var(--ink)]/80">{labelFor(s.key)}</span>
                      <span className="font-display tabular-nums" style={{ color: "var(--accent)" }}>{s.score.toFixed(1)}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PairingModal({ pairing, onClose }) {
      const { me, match } = pairing;
      const labelFor = (key) => RUBRIC_LABELS[key] || key;

      // Find the specific complementary skills
      const helpfulFromMatch = me.growth
        .map(w => ({ key: w.key, myScore: w.score, theirScore: match.averages[w.key] }))
        .filter(o => o.theirScore !== null && o.theirScore > o.myScore)
        .sort((a, b) => (b.theirScore - b.myScore) - (a.theirScore - a.myScore))
        .slice(0, 3);

      const helpfulFromMe = match.growth
        .map(w => ({ key: w.key, theirScore: w.score, myScore: me.averages[w.key] }))
        .filter(o => o.myScore !== null && o.myScore > o.theirScore)
        .sort((a, b) => (b.myScore - b.theirScore) - (a.myScore - a.theirScore))
        .slice(0, 3);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{ background: "rgba(11, 24, 40, 0.7)", backdropFilter: "blur(4px)" }} onClick={onClose}>
          <div className="card max-w-2xl w-full p-10 fade-up max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-3">Suggested pairing</div>
            <h2 className="font-display text-4xl mb-2 leading-tight">
              Pair with <span style={{ color: "var(--gold)" }}>{match.name}</span>
            </h2>
            <p className="text-sm text-[var(--ink)]/60 mb-8 leading-relaxed">
              Based on your training data, you and {match.name.split(" ")[0]} would be a strong pairing. Here's why.
            </p>

            {helpfulFromMatch.length > 0 && (
              <div className="card-warm p-6 mb-4">
                <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-3">Where {match.name.split(" ")[0]} can help you</div>
                <ul className="space-y-3">
                  {helpfulFromMatch.map((o, i) => (
                    <li key={i} className="text-sm leading-relaxed">
                      <div className="font-display text-base mb-0.5">{labelFor(o.key)}</div>
                      <div className="text-[var(--ink)]/70">
                        Your average: <span className="font-mono">{o.myScore.toFixed(1)}</span> · Theirs: <span className="font-mono" style={{ color: "var(--gold)" }}>{o.theirScore.toFixed(1)}</span>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {helpfulFromMe.length > 0 && (
              <div className="card-warm p-6 mb-8" style={{ background: "rgba(184, 137, 58, 0.08)" }}>
                <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-3">Where you can help {match.name.split(" ")[0]}</div>
                <ul className="space-y-3">
                  {helpfulFromMe.map((o, i) => (
                    <li key={i} className="text-sm leading-relaxed">
                      <div className="font-display text-base mb-0.5">{labelFor(o.key)}</div>
                      <div className="text-[var(--ink)]/70">
                        Their average: <span className="font-mono">{o.theirScore.toFixed(1)}</span> · Yours: <span className="font-mono" style={{ color: "var(--gold)" }}>{o.myScore.toFixed(1)}</span>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {helpfulFromMatch.length === 0 && helpfulFromMe.length === 0 && (
              <div className="card-warm p-6 mb-8">
                <p className="text-sm text-[var(--ink)]/70 leading-relaxed">
                  Both of you score similarly across all categories — you'd benefit most from comparing technique on shared strengths rather than skill exchange.
                </p>
              </div>
            )}

            <div className="card-warm p-6 mb-8" style={{ background: "rgba(11, 24, 40, 0.04)" }}>
              <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--ink)]/60 mb-2">Suggested next step</div>
              <p className="text-sm text-[var(--ink)]/80 leading-relaxed">
                Schedule a 30-minute session with {match.name.split(" ")[0]}. Each of you takes a turn pitching while the other observes through the lens of the categories above. Trade specific feedback on those moments.
              </p>
            </div>

            <div className="flex justify-end gap-3">
              <button onClick={onClose} className="btn-primary px-6 py-3 rounded text-xs uppercase tracking-[0.18em]">
                Got it
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState("dashboard");
      const [user, setUser] = useState(null); // Supabase user, populated by auth listener
      const [authLoading, setAuthLoading] = useState(true); // true while we check the initial session
      const [apiKey, setApiKey] = useState(() => storage.get(STORAGE_KEYS.apiKey, ""));
      const [reports, setReports] = useState(() => storage.get(STORAGE_KEYS.reports, []));
      const [reportsLoading, setReportsLoading] = useState(false);
      const [teamProfiles, setTeamProfiles] = useState([]);
      const [teamReports, setTeamReports] = useState([]);
      const [mode, setMode] = useState("pitch");
      const [activePersona, setActivePersona] = useState(null);
      const [activeReportId, setActiveReportId] = useState(null);
      const [grading, setGrading] = useState(false);
      const [voices, setVoices] = useState([]);
      const [preferredVoice, setPreferredVoice] = useState(() => storage.get(STORAGE_KEYS.preferredVoice, ""));
      const [chromeConfirmed, setChromeConfirmed] = useState(() => storage.get(STORAGE_KEYS.chromeConfirmed, false));

      // Load voices (browser quirk: voices populate asynchronously)
      useEffect(() => {
        const load = () => {
          const v = window.speechSynthesis.getVoices();
          if (v.length) setVoices(v);
        };
        load();
        window.speechSynthesis.onvoiceschanged = load;
      }, []);

      // ====================================================================
      // Supabase auth: listen for session changes
      // ====================================================================
      useEffect(() => {
        // Get initial session
        sb.auth.getSession().then(({ data }) => {
          if (data.session && data.session.user) {
            setUser(toAppUser(data.session.user));
          }
          setAuthLoading(false);
        });

        // Listen for changes
        const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
          if (session && session.user) {
            setUser(toAppUser(session.user));
          } else {
            setUser(null);
          }
        });

        return () => { subscription.unsubscribe(); };
      }, []);

      // ====================================================================
      // When user signs in: load report cards from cloud + migrate any local data
      // ====================================================================
      useEffect(() => {
        if (!user) return;

        let cancelled = false;
        (async () => {
          setReportsLoading(true);
          try {
            // Migrate local reports to cloud (one-time)
            await migrateLocalReportsIfNeeded(user.id);

            // Load all of this user's reports from cloud
            const cloudReports = await fetchUserReports(user.id);
            if (!cancelled) {
              setReports(cloudReports);
              storage.set(STORAGE_KEYS.reports, cloudReports);
            }
          } catch (e) {
            console.error("Failed to load cloud reports:", e);
            // Fall back to local cache
          } finally {
            if (!cancelled) setReportsLoading(false);
          }
        })();

        return () => { cancelled = true; };
      }, [user?.id]);

      // ====================================================================
      // Persistence (local cache only — cloud is authoritative for reports)
      // ====================================================================
      useEffect(() => { user ? storage.set(STORAGE_KEYS.user, user) : null; }, [user]);
      useEffect(() => { storage.set(STORAGE_KEYS.apiKey, apiKey); }, [apiKey]);
      useEffect(() => { storage.set(STORAGE_KEYS.reports, reports); }, [reports]);
      useEffect(() => { storage.set(STORAGE_KEYS.preferredVoice, preferredVoice); }, [preferredVoice]);
      useEffect(() => { storage.set(STORAGE_KEYS.chromeConfirmed, chromeConfirmed); }, [chromeConfirmed]);

      const handleSignOut = async () => {
        await sb.auth.signOut();
        // Auth listener will set user to null
      };

      const handleStartSession = () => {
        if (!apiKey) { setView("settings"); return; }
        setView("persona-setup");
      };

      const handleLaunchSession = (persona) => {
        setActivePersona(persona);
        setView("session");
      };

      const handleSessionComplete = async (transcript) => {
        if (!transcript || transcript.length < 2) {
          setView("dashboard");
          return;
        }
        setGrading(true);
        try {
          const transcriptText = transcript.map(t => `${t.role === "advisor" ? "ADVISOR" : "PROSPECT"}: ${t.text}`).join("\n\n");
          const reply = await callGroq({
            apiKey,
            model: MODEL_GRADER,
            messages: [
              { role: "system", content: "You are a meticulous sales coach. Always return valid JSON." },
              { role: "user", content: buildGraderSystemPrompt(activePersona, transcriptText) },
            ],
            temperature: 0.3,
            jsonMode: true,
          });
          const card = JSON.parse(reply);
          const newReport = {
            id: "rpt_" + Date.now(),
            createdAt: Date.now(),
            mode,
            persona: activePersona,
            transcript,
            card,
          };
          // Save to cloud
          try {
            await saveReportToCloud(user.id, newReport);
          } catch (e) {
            console.error("Cloud save failed (saved locally):", e);
          }
          // Update UI
          const updated = [newReport, ...reports];
          setReports(updated);
          setActiveReportId(newReport.id);
          setView("report-card");
        } catch (e) {
          alert("Couldn't generate report card: " + e.message + "\n\nThe transcript will still be saved locally.");
          const newReport = {
            id: "rpt_" + Date.now(),
            createdAt: Date.now(),
            mode,
            persona: activePersona,
            transcript,
            card: null,
          };
          setReports([newReport, ...reports]);
          setView("dashboard");
        } finally {
          setGrading(false);
        }
      };

      // ====================================================================
      // Load team data when entering team view
      // ====================================================================
      const loadTeamData = async () => {
        try {
          const [profiles, allReports] = await Promise.all([
            fetchAllProfiles(),
            fetchAllReports(),
          ]);
          setTeamProfiles(profiles);
          setTeamReports(allReports);
        } catch (e) {
          console.error("Failed to load team data:", e);
        }
      };

      const navigateToTeam = async () => {
        setView("team");
        loadTeamData(); // fire and forget
      };

      const activeReport = reports.find(r => r.id === activeReportId);

      // ====================================================================
      // Routing
      // ====================================================================
      if (authLoading) {
        return (
          <div className="min-h-screen paper-bg flex items-center justify-center">
            <div className="text-sm text-[var(--ink)]/40 uppercase tracking-[0.2em]">Loading…</div>
          </div>
        );
      }

      if (!user) return <LoginView onSignIn={() => {}} />;

      // Browser check — happens once per browser, right after first login
      if (!chromeConfirmed) {
        return (
          <BrowserCheckModal
            user={user}
            onSignOut={handleSignOut}
            onConfirm={() => setChromeConfirmed(true)}
          />
        );
      }

      // First-time setup — runs once until they have a working key
      if (!apiKey) {
        return (
          <OnboardingView
            user={user}
            voices={voices}
            onSignOut={handleSignOut}
            onComplete={({ apiKey: newKey, voice }) => {
              setApiKey(newKey);
              if (voice) setPreferredVoice(voice);
              setView("dashboard");
            }}
          />
        );
      }

      if (grading) return <GradingView />;

      if (view === "session" && activePersona) {
        return (
          <SessionView
            apiKey={apiKey}
            mode={mode}
            persona={activePersona}
            voice={preferredVoice}
            onComplete={handleSessionComplete}
            onCancel={() => { stopSpeaking(); setView("dashboard"); setActivePersona(null); }}
          />
        );
      }

      return (
        <div className="min-h-screen paper-bg">
          <TopNav user={user} onSignOut={handleSignOut} onNavigate={(v) => v === "team" ? navigateToTeam() : setView(v)} currentView={view} />
          {view === "dashboard" && (
            <DashboardView
              user={user}
              mode={mode}
              setMode={setMode}
              reports={reports}
              onStartSession={handleStartSession}
              onViewReport={(id) => { if (id) { setActiveReportId(id); setView("report-card"); } else { setView("history"); } }}
              hasApiKey={!!apiKey}
            />
          )}
          {view === "history" && (
            <HistoryView
              reports={reports}
              onView={(id) => { setActiveReportId(id); setView("report-card"); }}
            />
          )}
          {view === "team" && (
            <MyTeamView
              currentUser={user}
              profiles={teamProfiles}
              allReports={teamReports}
              onRefresh={loadTeamData}
            />
          )}
          {view === "settings" && (
            <SettingsView
              apiKey={apiKey}
              onSaveKey={setApiKey}
              onNavigate={setView}
              voices={voices}
              preferredVoice={preferredVoice}
              onSetVoice={setPreferredVoice}
            />
          )}
          {view === "persona-setup" && (
            <PersonaSetupView
              apiKey={apiKey}
              mode={mode}
              onLaunch={handleLaunchSession}
              onCancel={() => setView("dashboard")}
            />
          )}
          {view === "report-card" && activeReport && (
            <ReportCardView report={activeReport} onBack={() => setView("dashboard")} />
          )}
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
