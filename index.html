    // Compact row for leaderboard positions 4+
    function LeaderboardRow({ entry, rank }) {
      const tooltip = `Avg score: ${entry.avg.toFixed(1)} · ${entry.sessionCount} ${entry.sessionCount === 1 ? "pitch" : "pitches"} this month`;
      return (
        <div
          className={`px-5 py-3 flex items-center justify-between cursor-default transition-colors hover:bg-[var(--parchment-dim)] ${entry.isMe ? "bg-[var(--parchment)]" : ""}`}
          title={tooltip}
        >
          <div className="flex items-center gap-4 min-w-0">
            <div className="font-display text-base text-[var(--ink)]/40 tabular-nums w-6">#{rank}</div>
            <LogoMark size={32} />
            <div className="min-w-0">
              <div className="text-sm truncate">
                <span className={entry.isMe ? "font-display text-[var(--gold)]" : ""}>{entry.name}</span>
                {entry.isMe && <span className="text-[10px] uppercase tracking-[0.18em] text-[var(--gold)] ml-2">You</span>}
              </div>
              <div className="text-[11px] text-[var(--ink)]/50 truncate">{entry.sessionCount} {entry.sessionCount === 1 ? "pitch" : "pitches"} this month</div>
            </div>
          </div>
          <div className="font-display text-xl tabular-nums" style={{ color: "var(--gold)" }}>{entry.avg.toFixed(1)}</div>
        </div>
      );
    }

    function AdvisorCard({ data, highlighted = false }) {
      const labelFor = (key) => RUBRIC_LABELS[key] || key;

      return (
        <div className={`card p-6 ${highlighted ? "ring-2" : ""}`} style={highlighted ? { boxShadow: "0 0 0 1px var(--gold)" } : {}}>
          <div className="flex items-start justify-between gap-6 flex-wrap">
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-3 mb-1">
                <div className="font-display text-xl">{data.name}</div>
                {data.reportCount === 0 && <span className="text-[10px] uppercase tracking-[0.18em] text-[var(--ink)]/40">No sessions yet</span>}
              </div>
              <div className="text-xs text-[var(--ink)]/50 font-mono">{data.email}</div>
            </div>
            <div className="text-right">
              <div className="font-display text-3xl" style={{ color: data.overall ? "var(--gold)" : "var(--ink)" }}>
                {data.overall ? data.overall.toFixed(1) : "—"}
              </div>
              <div className="text-[10px] uppercase tracking-[0.18em] text-[var(--ink)]/50">overall · {data.reportCount} sessions</div>
            </div>
          </div>

          {data.reportCount > 0 && (
            <div className="grid md:grid-cols-2 gap-4 mt-5 pt-5 border-t" style={{ borderColor: "var(--rule)" }}>
              <div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--gold)] mb-2">Strengths</div>
                <ul className="space-y-1.5">
                  {data.strengths.map((s, i) => (
                    <li key={i} className="text-sm flex justify-between gap-3">
                      <span className="text-[var(--ink)]/80">{labelFor(s.key)}</span>
                      <span className="font-display tabular-nums" style={{ color: "var(--gold)" }}>{s.score.toFixed(1)}</span>
                    </li>
                  ))}
                </ul>
              </div>
              <div>
                <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--accent)] mb-2">Growth Areas</div>
                <ul className="space-y-1.5">
                  {data.growth.map((s, i) => (
                    <li key={i} className="text-sm flex justify-between gap-3">
                      <span className="text-[var(--ink)]/80">{labelFor(s.key)}</span>
                      <span className="font-display tabular-nums" style={{ color: "var(--accent)" }}>{s.score.toFixed(1)}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          )}
        </div>
      );
    }

    function PairingModal({ pairing, onClose }) {
      const { me, match } = pairing;
      const labelFor = (key) => RUBRIC_LABELS[key] || key;

      // Find the specific complementary skills
      const helpfulFromMatch = me.growth
        .map(w => ({ key: w.key, myScore: w.score, theirScore: match.averages[w.key] }))
        .filter(o => o.theirScore !== null && o.theirScore > o.myScore)
        .sort((a, b) => (b.theirScore - b.myScore) - (a.theirScore - a.myScore))
        .slice(0, 3);

      const helpfulFromMe = match.growth
        .map(w => ({ key: w.key, theirScore: w.score, myScore: me.averages[w.key] }))
        .filter(o => o.myScore !== null && o.myScore > o.theirScore)
        .sort((a, b) => (b.myScore - b.theirScore) - (a.myScore - a.theirScore))
        .slice(0, 3);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{ background: "rgba(11, 24, 40, 0.7)", backdropFilter: "blur(4px)" }} onClick={onClose}>
          <div className="card max-w-2xl w-full p-10 fade-up max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-3">Suggested pairing</div>
            <h2 className="font-display text-4xl mb-2 leading-tight">
              Pair with <span style={{ color: "var(--gold)" }}>{match.name}</span>
            </h2>
            <p className="text-sm text-[var(--ink)]/60 mb-8 leading-relaxed">
              Based on your training data, you and {match.name.split(" ")[0]} would be a strong pairing. Here's why.
            </p>

            {helpfulFromMatch.length > 0 && (
              <div className="card-warm p-6 mb-4">
                <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-3">Where {match.name.split(" ")[0]} can help you</div>
                <ul className="space-y-3">
                  {helpfulFromMatch.map((o, i) => (
                    <li key={i} className="text-sm leading-relaxed">
                      <div className="font-display text-base mb-0.5">{labelFor(o.key)}</div>
                      <div className="text-[var(--ink)]/70">
                        Your average: <span className="font-mono">{o.myScore.toFixed(1)}</span> · Theirs: <span className="font-mono" style={{ color: "var(--gold)" }}>{o.theirScore.toFixed(1)}</span>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {helpfulFromMe.length > 0 && (
              <div className="card-warm p-6 mb-8" style={{ background: "rgba(184, 137, 58, 0.08)" }}>
                <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-3">Where you can help {match.name.split(" ")[0]}</div>
                <ul className="space-y-3">
                  {helpfulFromMe.map((o, i) => (
                    <li key={i} className="text-sm leading-relaxed">
                      <div className="font-display text-base mb-0.5">{labelFor(o.key)}</div>
                      <div className="text-[var(--ink)]/70">
                        Their average: <span className="font-mono">{o.theirScore.toFixed(1)}</span> · Yours: <span className="font-mono" style={{ color: "var(--gold)" }}>{o.myScore.toFixed(1)}</span>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {helpfulFromMatch.length === 0 && helpfulFromMe.length === 0 && (
              <div className="card-warm p-6 mb-8">
                <p className="text-sm text-[var(--ink)]/70 leading-relaxed">
                  Both of you score similarly across all categories — you'd benefit most from comparing technique on shared strengths rather than skill exchange.
                </p>
              </div>
            )}

            <div className="card-warm p-6 mb-8" style={{ background: "rgba(11, 24, 40, 0.04)" }}>
              <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--ink)]/60 mb-2">Suggested next step</div>
              <p className="text-sm text-[var(--ink)]/80 leading-relaxed">
                Schedule a 30-minute session with {match.name.split(" ")[0]}. Each of you takes a turn pitching while the other observes through the lens of the categories above. Trade specific feedback on those moments.
              </p>
            </div>

            <div className="flex justify-end gap-3">
              <button onClick={onClose} className="btn-primary px-6 py-3 rounded text-xs uppercase tracking-[0.18em]">
                Got it
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ======================================================================
    // MANAGER ACCESS — hidden, password-gated
    // ======================================================================

    // The password is intentionally in the front-end. This is a UX gate, not a real security boundary.
    // The Supabase RLS already permits authenticated users to read all reports (needed for My Team).
    // For real security upgrade later: add a `role` column to profiles + RLS policies that gate manager actions.
    const MANAGER_PASSWORD = "SilkTower?192";

    function ManagerPasswordModal({ onUnlock, onClose }) {
      const [pw, setPw] = useState("");
      const [error, setError] = useState("");
      const inputRef = useRef(null);

      useEffect(() => {
        // Auto-focus the password field
        const t = setTimeout(() => inputRef.current?.focus(), 50);
        return () => clearTimeout(t);
      }, []);

      const submit = () => {
        if (pw === MANAGER_PASSWORD) {
          onUnlock();
        } else {
          setError("Incorrect password.");
          setPw("");
          inputRef.current?.focus();
        }
      };

      const handleKey = (e) => {
        if (e.key === "Enter") { e.preventDefault(); submit(); }
        if (e.key === "Escape") { e.preventDefault(); onClose(); }
      };

      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-6" style={{ background: "rgba(33, 101, 97, 0.4)", backdropFilter: "blur(4px)" }} onClick={onClose}>
          <div className="card w-full max-w-md p-8 fade-up" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-3 mb-3">
              <div className="w-10 h-10 rounded-full flex items-center justify-center" style={{ background: "rgba(33, 101, 97, 0.1)" }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M7 11V7a5 5 0 0110 0v4"></path>
                  <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                </svg>
              </div>
              <div>
                <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)]">Restricted</div>
                <div className="font-display text-xl">Manager Access</div>
              </div>
            </div>
            <p className="text-sm text-[var(--ink)]/60 mb-6 leading-relaxed">
              Enter the manager password to view all advisors' report cards and full session data.
            </p>
            <input
              ref={inputRef}
              type="password"
              value={pw}
              onChange={e => { setPw(e.target.value); setError(""); }}
              onKeyDown={handleKey}
              placeholder="Manager password"
              className="input-field w-full px-4 py-3 rounded text-sm mb-3"
            />
            {error && <div className="text-xs text-[var(--accent)] mb-3">{error}</div>}
            <div className="flex justify-end gap-3 mt-2">
              <button onClick={onClose} className="btn-ghost px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">
                Cancel
              </button>
              <button onClick={submit} disabled={!pw} className="btn-primary px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">
                Unlock
              </button>
            </div>
            <div className="text-[10px] text-[var(--ink)]/40 mt-5 pt-4 border-t" style={{ borderColor: "var(--rule)" }}>
              Manager access lasts until you sign out or close this tab. Press <kbd className="px-1.5 py-0.5 rounded bg-[var(--parchment-dim)] font-mono text-[10px]">Esc</kbd> to cancel.
            </div>
          </div>
        </div>
      );
    }

    // ======================================================================
    // MANAGER VIEW — view any advisor's full data
    // ======================================================================

    function ManagerView({ profiles, allReports, selectedAdvisorId, setSelectedAdvisorId, onViewReport, onLock, onRefresh }) {
      const selected = profiles.find(p => p.id === selectedAdvisorId);

      // Toggle: include Practice + Curriculum sessions in this advisor's score stats?
      // Default OFF — same default as the personal Report Cards page.
      // Objections drills are NEVER included regardless.
      const [includePractice, setIncludePractice] = useState(false);

      const advisorReports = useMemo(() => {
        if (!selected) return [];
        return allReports
          .filter(r => r.userId === selected.id)
          .sort((a, b) => b.createdAt - a.createdAt);
      }, [allReports, selected]);

      // Stats for the selected advisor — toggle controls whether Practice + Curriculum are included
      const stats = useMemo(() => {
        if (!selected) return null;
        const reportsWithScores = advisorReports.filter(r => shouldCountForPersonalStats(r, includePractice) && Object.keys(r.card?.scores || {}).length > 0);
        if (reportsWithScores.length === 0) return { hasData: false };

        const scoresPerReport = reportsWithScores.map(r => {
          const arr = Object.values(r.card.scores).map(s => s.score).filter(s => typeof s === "number" && s > 0);
          return arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
        }).filter(s => s !== null);

        const overallAvg = scoresPerReport.length > 0
          ? scoresPerReport.reduce((a, b) => a + b, 0) / scoresPerReport.length
          : null;

        const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
        const recentReports = reportsWithScores.filter(r => r.createdAt >= cutoff);
        const recentScores = recentReports.map(r => {
          const arr = Object.values(r.card.scores).map(s => s.score).filter(s => typeof s === "number" && s > 0);
          return arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
        }).filter(s => s !== null);

        const last30Avg = recentScores.length > 0
          ? recentScores.reduce((a, b) => a + b, 0) / recentScores.length
          : null;

        const lineData = [...reportsWithScores]
          .sort((a, b) => a.createdAt - b.createdAt)
          .map(r => {
            const arr = Object.values(r.card.scores).map(s => s.score).filter(s => typeof s === "number" && s > 0);
            const score = arr.length > 0 ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
            return { id: r.id, score, date: new Date(r.createdAt) };
          });

        return {
          hasData: true,
          overallAvg,
          last30Avg,
          recentCount: recentReports.length,
          totalCount: reportsWithScores.length,
          lineData,
          categoryBreakdown: computeCategoryBreakdown(reportsWithScores),
        };
      }, [advisorReports, selected, includePractice]);

      // Build a sorted list of advisors (with session counts so the dropdown is informative)
      const advisorOptions = useMemo(() => {
        return profiles
          .map(p => {
            const count = allReports.filter(r => r.userId === p.id).length;
            const pitchCount = allReports.filter(r => r.userId === p.id && isPitchReport(r)).length;
            return {
              id: p.id,
              email: p.email,
              name: p.name || nameFromEmailLocal(p.email),
              count,
              pitchCount,
            };
          })
          .sort((a, b) => a.name.localeCompare(b.name));
      }, [profiles, allReports]);

      return (
        <div className="max-w-6xl mx-auto px-8 py-12 fade-up">
          {/* Header */}
          <div className="flex items-end justify-between mb-8 flex-wrap gap-4">
            <div>
              <div className="flex items-center gap-2 mb-2">
                <div className="text-xs uppercase tracking-[0.25em]" style={{ color: "#b8893a" }}>Manager Mode</div>
                <span className="text-[10px] text-[var(--ink)]/40">·</span>
                <div className="text-xs uppercase tracking-[0.18em] text-[var(--ink)]/50">Restricted access</div>
              </div>
              <h1 className="font-display text-5xl mb-3 leading-tight">Advisor Reports</h1>
              <p className="text-sm text-[var(--ink)]/60 max-w-2xl leading-relaxed">
                View any advisor's full session history, scores, transcripts, and feedback. Use this for coaching reviews, performance check-ins, and identifying advisors who need support.
              </p>
            </div>
            <div className="flex gap-3">
              <button onClick={onRefresh} className="btn-ghost px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">
                Refresh Data
              </button>
              <button onClick={onLock} className="px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em] text-[var(--ink)]/60 hover:text-[var(--accent)] border border-transparent hover:border-[var(--accent)]/30">
                🔒 Lock Manager
              </button>
            </div>
          </div>

          {/* Advisor selector */}
          <div className="card p-6 mb-8">
            <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--ink)]/60 mb-3">Viewing advisor</div>
            <div className="flex flex-wrap gap-2">
              {advisorOptions.length === 0 && (
                <div className="text-sm text-[var(--ink)]/50 italic">Loading advisors…</div>
              )}
              {advisorOptions.map(a => {
                const isSelected = a.id === selectedAdvisorId;
                return (
                  <button
                    key={a.id}
                    onClick={() => setSelectedAdvisorId(a.id)}
                    className={`px-4 py-2.5 rounded text-left transition-all min-w-[180px] ${
                      isSelected ? "ink-bg" : "border border-[var(--rule)] hover:border-[var(--ink)]"
                    }`}
                  >
                    <div className={`text-sm font-display ${isSelected ? "text-white" : "text-[var(--ink)]"}`}>
                      {a.name}
                    </div>
                    <div className={`text-[10px] uppercase tracking-[0.15em] mt-0.5 ${isSelected ? "text-white/70" : "text-[var(--ink)]/50"}`}>
                      {a.pitchCount} {a.pitchCount === 1 ? "pitch" : "pitches"} · {a.count} total
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* If no advisor selected, prompt to pick one */}
          {!selected && (
            <div className="card p-12 text-center">
              <div className="font-display text-xl text-[var(--ink)]/50 mb-2">Pick an advisor above</div>
              <p className="text-sm text-[var(--ink)]/50">Select someone to view their stats, sessions, and full report cards.</p>
            </div>
          )}

          {/* Selected advisor's data */}
          {selected && (
            <div className="fade-up">
              {/* Identity block */}
              <div className="card-warm p-5 mb-6 flex items-center gap-4">
                <LogoMark size={48} />
                <div>
                  <div className="font-display text-2xl">{selected.name || nameFromEmailLocal(selected.email)}</div>
                  <div className="text-xs text-[var(--ink)]/60 font-mono">{selected.email}</div>
                </div>
              </div>

              {/* Stats filter toggle — same as the personal Report Cards page */}
              <div className="card p-4 mb-6 flex items-center justify-between flex-wrap gap-3">
                <div className="min-w-0">
                  <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--ink)]/60 mb-0.5">Score stats include</div>
                  <div className="text-xs text-[var(--ink)]/50">
                    {includePractice
                      ? "Pitches + Practice + Curriculum sessions"
                      : "Pitches only — Practice and Curriculum are excluded by default"}
                  </div>
                </div>
                <div className="mode-toggle shrink-0">
                  <button
                    onClick={() => setIncludePractice(false)}
                    className={!includePractice ? "active" : ""}
                  >
                    Pitches Only
                  </button>
                  <button
                    onClick={() => setIncludePractice(true)}
                    className={includePractice ? "active" : ""}
                  >
                    Include Practice & Curriculum
                  </button>
                </div>
              </div>

              {/* Stats grid */}
              {stats?.hasData ? (
                <>
                  <div className="grid md:grid-cols-3 gap-4 mb-6">
                    <div className="card p-5">
                      <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--ink)]/50 mb-2">All-Time Average</div>
                      <div className="font-display text-4xl mb-1" style={{ color: "var(--gold)" }}>{stats.overallAvg.toFixed(1)}</div>
                      <div className="text-xs text-[var(--ink)]/60">Across {stats.totalCount} {stats.totalCount === 1 ? "session" : "sessions"}</div>
                    </div>
                    <div className="card p-5">
                      <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--ink)]/50 mb-2">Last 30 Days</div>
                      <div className="font-display text-4xl mb-1" style={{ color: stats.last30Avg ? "var(--ink)" : "var(--ink)" + "33" }}>
                        {stats.last30Avg ? stats.last30Avg.toFixed(1) : "—"}
                      </div>
                      <div className="text-xs text-[var(--ink)]/60">
                        {stats.recentCount > 0 ? `${stats.recentCount} ${stats.recentCount === 1 ? "session" : "sessions"} in last 30 days` : "No sessions in last 30 days"}
                      </div>
                    </div>
                    <div className="card p-5">
                      <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--ink)]/50 mb-2">Trend</div>
                      {stats.last30Avg && stats.overallAvg ? (
                        <>
                          <div className="font-display text-4xl mb-1" style={{ color: stats.last30Avg > stats.overallAvg ? "var(--gold)" : stats.last30Avg < stats.overallAvg ? "var(--accent)" : "var(--ink)" }}>
                            {stats.last30Avg > stats.overallAvg ? "↗" : stats.last30Avg < stats.overallAvg ? "↘" : "→"}
                            {" "}
                            {(stats.last30Avg - stats.overallAvg >= 0 ? "+" : "")}
                            {(stats.last30Avg - stats.overallAvg).toFixed(1)}
                          </div>
                          <div className="text-xs text-[var(--ink)]/60">Last 30 days vs. all-time</div>
                        </>
                      ) : (
                        <>
                          <div className="font-display text-4xl mb-1 text-[var(--ink)]/30">—</div>
                          <div className="text-xs text-[var(--ink)]/60">Need both periods to compare</div>
                        </>
                      )}
                    </div>
                  </div>

                  {/* Progression chart */}
                  {stats.lineData.length >= 2 && (
                    <div className="card p-6 mb-8">
                      <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--ink)]/50 mb-4">Score Progression</div>
                      <ProgressionBarChart data={stats.lineData} />
                    </div>
                  )}

                  {/* Section analysis */}
                  <div className="mb-8">
                    <div className="flex items-baseline justify-between mb-4 flex-wrap gap-2">
                      <h2 className="font-display text-2xl">Section Analysis</h2>
                      <p className="text-xs text-[var(--ink)]/50">All-time, last 30 days, and trend by category</p>
                    </div>
                    <CategoryBreakdownGrid breakdown={stats.categoryBreakdown} />
                  </div>
                </>
              ) : (
                <div className="card p-10 mb-8 text-center">
                  <div className="font-display text-lg text-[var(--ink)]/50 mb-1">
                    {includePractice
                      ? "No scored sessions yet"
                      : "No scored Pitch sessions yet"}
                  </div>
                  <p className="text-sm text-[var(--ink)]/50">
                    {includePractice
                      ? "This advisor hasn't completed any sessions that produced scores. Objections drills don't count."
                      : "This advisor hasn't completed any real Pitch sessions yet. Toggle the filter above to include their Practice and Curriculum sessions."}
                  </p>
                </div>
              )}

              {/* All sessions list */}
              <div>
                <div className="flex items-baseline justify-between mb-4 flex-wrap gap-2">
                  <h2 className="font-display text-2xl">All Sessions</h2>
                  <p className="text-xs text-[var(--ink)]/50">{advisorReports.length} total · Click any to review</p>
                </div>
                {advisorReports.length === 0 ? (
                  <div className="card p-12 text-center">
                    <div className="font-display text-base text-[var(--ink)]/50 mb-1">Nothing here yet</div>
                    <p className="text-sm text-[var(--ink)]/50">This advisor hasn't completed any sessions.</p>
                  </div>
                ) : (
                  <div className="grid md:grid-cols-2 gap-4">
                    {advisorReports.map(r => (
                      <ReportCardSummary key={r.id} report={r} onView={() => onViewReport(r.id)} />
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [view, setView] = useState("dashboard");
      const [user, setUser] = useState(null); // Supabase user, populated by auth listener
      const [authLoading, setAuthLoading] = useState(true); // true while we check the initial session
      const [apiKey, setApiKey] = useState(() => storage.get(STORAGE_KEYS.apiKey, ""));
      const [reports, setReports] = useState(() => storage.get(STORAGE_KEYS.reports, []));
      const [reportsLoading, setReportsLoading] = useState(false);
      const [teamProfiles, setTeamProfiles] = useState([]);
      const [teamReports, setTeamReports] = useState([]);
      const [mode, setMode] = useState("pitch");
      const [activePersona, setActivePersona] = useState(null);
      const [activeReportId, setActiveReportId] = useState(null);
      const [grading, setGrading] = useState(false);
      const [voices, setVoices] = useState([]);
      const [preferredVoice, setPreferredVoice] = useState(() => storage.get(STORAGE_KEYS.preferredVoice, ""));
      const [speechRate, setSpeechRateState] = useState(() => {
        const saved = storage.get(STORAGE_KEYS.speechRate, 1.0);
        const n = typeof saved === "number" ? saved : parseFloat(saved);
        return (!isNaN(n) && n >= 0.5 && n <= 2.0) ? n : 1.0;
      });
      const setSpeechRate = (rate) => {
        const safe = Math.max(0.5, Math.min(2.0, rate));
        setSpeechRateState(safe);
        storage.set(STORAGE_KEYS.speechRate, safe);
      };
      const [chromeConfirmed, setChromeConfirmed] = useState(() => storage.get(STORAGE_KEYS.chromeConfirmed, false));

      // ===== Manager mode (hidden, password-gated) =====
      // Per-session unlock — clears when the tab closes (sessionStorage).
      const [managerUnlocked, setManagerUnlocked] = useState(() => {
        try { return sessionStorage.getItem("crpt_mgr_unlocked") === "1"; } catch { return false; }
      });
      const [managerPwModalOpen, setManagerPwModalOpen] = useState(false);
      const [managerSelectedAdvisorId, setManagerSelectedAdvisorId] = useState(null);
      const [cameFromManager, setCameFromManager] = useState(false); // tracks if a report card was opened from manager view

      const lockManager = () => {
        try { sessionStorage.removeItem("crpt_mgr_unlocked"); } catch {}
        setManagerUnlocked(false);
        setManagerSelectedAdvisorId(null);
        setCameFromManager(false);
        if (view === "manager") setView("dashboard");
      };

      const unlockManager = () => {
        try { sessionStorage.setItem("crpt_mgr_unlocked", "1"); } catch {}
        setManagerUnlocked(true);
        setManagerPwModalOpen(false);
        // Make sure team data is loaded so the manager view has profiles + reports
        loadTeamData();
        setView("manager");
      };

      // Global keyboard shortcut: Ctrl+Alt+M (or Cmd+Alt+M on Mac) opens the password prompt.
      // Note: Chrome reserves Ctrl+Shift+M for the profile picker, so we use Alt instead.
      // Only available when the user is signed in (otherwise the shortcut is a no-op).
      useEffect(() => {
        if (!user) return;
        const handler = (e) => {
          // Detect Ctrl+Alt+M or Cmd+Alt+M (case-insensitive on the M)
          const isModifier = (e.ctrlKey || e.metaKey) && e.altKey;
          if (isModifier && (e.key === "M" || e.key === "m" || e.code === "KeyM")) {
            e.preventDefault();
            e.stopPropagation();
            if (managerUnlocked) {
              // Already unlocked — just navigate there
              setView("manager");
              if (!teamProfiles.length || !teamReports.length) loadTeamData();
            } else {
              setManagerPwModalOpen(true);
            }
          }
        };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [user, managerUnlocked, teamProfiles.length, teamReports.length]);

      // Load voices (browser quirk: voices populate asynchronously)
      useEffect(() => {
        const load = () => {
          const v = window.speechSynthesis.getVoices();
          if (v.length) setVoices(v);
        };
        load();
        window.speechSynthesis.onvoiceschanged = load;
      }, []);

      // ====================================================================
      // Supabase auth: listen for session changes
      // ====================================================================
      useEffect(() => {
        // Get initial session
        sb.auth.getSession().then(({ data }) => {
          if (data.session && data.session.user) {
            setUser(toAppUser(data.session.user));
          }
          setAuthLoading(false);
        });

        // Listen for changes
        const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
          if (session && session.user) {
            setUser(toAppUser(session.user));
          } else {
            setUser(null);
          }
        });

        return () => { subscription.unsubscribe(); };
      }, []);

      // ====================================================================
      // When user signs in: load report cards from cloud + migrate any local data
      // ====================================================================
      useEffect(() => {
        if (!user) return;

        let cancelled = false;
        (async () => {
          setReportsLoading(true);
          try {
            // Migrate local reports to cloud (one-time)
            await migrateLocalReportsIfNeeded(user.id);

            // Load all of this user's reports from cloud
            const cloudReports = await fetchUserReports(user.id);
            if (!cancelled) {
              setReports(cloudReports);
              storage.set(STORAGE_KEYS.reports, cloudReports);
            }
          } catch (e) {
            console.error("Failed to load cloud reports:", e);
            // Fall back to local cache
          } finally {
            if (!cancelled) setReportsLoading(false);
          }
        })();

        return () => { cancelled = true; };
      }, [user?.id]);

      // ====================================================================
      // Persistence (local cache only — cloud is authoritative for reports)
      // ====================================================================
      useEffect(() => { user ? storage.set(STORAGE_KEYS.user, user) : null; }, [user]);
      useEffect(() => { storage.set(STORAGE_KEYS.apiKey, apiKey); }, [apiKey]);
      useEffect(() => { storage.set(STORAGE_KEYS.reports, reports); }, [reports]);
      useEffect(() => { storage.set(STORAGE_KEYS.preferredVoice, preferredVoice); }, [preferredVoice]);
      useEffect(() => { storage.set(STORAGE_KEYS.chromeConfirmed, chromeConfirmed); }, [chromeConfirmed]);

      const handleSignOut = async () => {
        await sb.auth.signOut();
        // Auth listener will set user to null
      };

      const handleStartSession = () => {
        if (!apiKey) { setView("settings"); return; }
        if (mode === "spin") {
          setView("spin");
        } else {
          setView("persona-setup");
        }
      };

      const handleLaunchSession = (persona) => {
        setActivePersona(persona);
        setView("session");
      };

      // ====================================================================
      // Save spin drill session as a special report card
      // ====================================================================
      const handleSpinComplete = async (drillResults, difficulty) => {
        if (!drillResults || drillResults.length === 0) {
          setView("dashboard");
          return;
        }

        // Compute aggregate score (for display only — does NOT roll into rubric)
        const avgScore = drillResults.reduce((s, r) => s + r.score, 0) / drillResults.length;

        // Build a synthetic "report card" so it shows up in history.
        // IMPORTANT: card.scores is intentionally EMPTY {} — Objections drills are practice,
        // not pitches, and we don't want them to count toward the advisor's overall average,
        // section breakdowns, or the team leaderboard.
        const newReport = {
          id: "rpt_" + Date.now(),
          createdAt: Date.now(),
          mode: "spin",
          persona: {
            name: `Objections Drill (${difficulty})`,
            difficulty,
            notes: `${drillResults.length} ${drillResults.length === 1 ? "objection" : "objections"} drilled · avg ${avgScore.toFixed(1)}/10`,
          },
          transcript: drillResults.flatMap(r => [
            { role: "prospect", text: r.question.text, ts: Date.now() },
            { role: "advisor", text: r.response, ts: Date.now() + 1 },
          ]),
          card: {
            scores: {}, // intentionally empty — does not contribute to averages
            summary: `Drilled ${drillResults.length} ${difficulty}-difficulty ${drillResults.length === 1 ? "objection" : "objections"}. Average score: ${avgScore.toFixed(1)}/10. (Practice only — does not affect overall scores.)`,
            top_strengths: drillResults.filter(r => r.score >= 7).slice(0, 3).map(r => `Handled ${r.question.category}: "${r.question.text.slice(0, 60)}${r.question.text.length > 60 ? "..." : ""}"`),
            top_growth_areas: drillResults.filter(r => r.score <= 5).slice(0, 3).map(r => `Struggled with ${r.question.category}: "${r.question.text.slice(0, 60)}${r.question.text.length > 60 ? "..." : ""}"`),
            spinDrills: drillResults, // full per-question data for the review UI
            isObjectionsDrill: true, // explicit flag so views can tell drills apart
            drillAvgScore: avgScore,
          },
          voiceAnalytics: null,
        };

        // Save to cloud
        try {
          await saveReportToCloud(user.id, newReport);
        } catch (e) {
          console.error("Cloud save failed (saved locally):", e);
        }

        const updated = [newReport, ...reports];
        setReports(updated);
        setActiveReportId(newReport.id);
        setView("report-card");
      };

      const handleSessionComplete = async (transcript) => {
        if (!transcript || transcript.length < 2) {
          setView("dashboard");
          return;
        }
        setGrading(true);
        // Compute voice analytics from transcript
        const voiceAnalytics = computeVoiceAnalytics(transcript);
        try {
          const transcriptText = transcript.map(t => `${t.role === "advisor" ? "ADVISOR" : "PROSPECT"}: ${t.text}`).join("\n\n");
          const reply = await callGroq({
            apiKey,
            model: MODEL_GRADER,
            messages: [
              { role: "system", content: "You are a meticulous sales coach. Always return valid JSON." },
              { role: "user", content: buildGraderSystemPrompt(activePersona, transcriptText) },
            ],
            temperature: 0.3,
            jsonMode: true,
          });
          const card = JSON.parse(reply);
          const newReport = {
            id: "rpt_" + Date.now(),
            createdAt: Date.now(),
            mode,
            persona: activePersona,
            transcript,
            card,
            voiceAnalytics,
          };
          // Save to cloud
          try {
            await saveReportToCloud(user.id, newReport);
          } catch (e) {
            console.error("Cloud save failed (saved locally):", e);
          }
          // Update UI
          const updated = [newReport, ...reports];
          setReports(updated);
          setActiveReportId(newReport.id);
          setView("report-card");
        } catch (e) {
          alert("Couldn't generate report card: " + e.message + "\n\nThe transcript will still be saved locally.");
          const newReport = {
            id: "rpt_" + Date.now(),
            createdAt: Date.now(),
            mode,
            persona: activePersona,
            transcript,
            card: null,
            voiceAnalytics,
          };
          setReports([newReport, ...reports]);
          setView("dashboard");
        } finally {
          setGrading(false);
        }
      };

      // ====================================================================
      // Delete a report (from cloud + local state)
      // ====================================================================
      const handleDeleteReport = async (reportId) => {
        // If it's a local-only report (id starts with rpt_), just remove from state
        if (typeof reportId === "string" && reportId.startsWith("rpt_")) {
          setReports(prev => prev.filter(r => r.id !== reportId));
          return;
        }
        try {
          await deleteReportFromCloud(reportId);
          setReports(prev => prev.filter(r => r.id !== reportId));
        } catch (e) {
          throw new Error("Couldn't delete from cloud: " + e.message);
        }
      };

      // ====================================================================
      // Load team data when entering team view
      // ====================================================================
      const loadTeamData = async () => {
        try {
          const [profiles, allReports] = await Promise.all([
            fetchAllProfiles(),
            fetchAllReports(),
          ]);
          setTeamProfiles(profiles);
          setTeamReports(allReports);
        } catch (e) {
          console.error("Failed to load team data:", e);
        }
      };

      const navigateToTeam = async () => {
        setView("team");
        loadTeamData(); // fire and forget
      };

      // Look in own reports first; if in manager mode, also check teamReports (other advisors' reports)
      const activeReport = reports.find(r => r.id === activeReportId)
        || (managerUnlocked ? teamReports.find(r => r.id === activeReportId) : null);

      // ====================================================================
      // Routing
      // ====================================================================
      if (authLoading) {
        return (
          <div className="min-h-screen paper-bg flex items-center justify-center">
            <div className="text-sm text-[var(--ink)]/40 uppercase tracking-[0.2em]">Loading…</div>
          </div>
        );
      }

      if (!user) return <LoginView onSignIn={() => {}} />;

      // Browser check — happens once per browser, right after first login
      if (!chromeConfirmed) {
        return (
          <BrowserCheckModal
            user={user}
            onSignOut={handleSignOut}
            onConfirm={() => setChromeConfirmed(true)}
          />
        );
      }

      // First-time setup — runs once until they have a working key
      if (!apiKey) {
        return (
          <OnboardingView
            user={user}
            voices={voices}
            onSignOut={handleSignOut}
            onComplete={({ apiKey: newKey, voice }) => {
              setApiKey(newKey);
              if (voice) setPreferredVoice(voice);
              setView("dashboard");
            }}
          />
        );
      }

      if (grading) return <GradingView />;

      if (view === "session" && activePersona) {
        return (
          <SessionView
            apiKey={apiKey}
            mode={mode}
            persona={activePersona}
            voice={preferredVoice}
            speechRate={speechRate}
            onComplete={handleSessionComplete}
            onCancel={() => { stopSpeaking(); setView("dashboard"); setActivePersona(null); }}
          />
        );
      }

      if (view === "spin") {
        return (
          <SpinView
            apiKey={apiKey}
            voice={preferredVoice}
            speechRate={speechRate}
            onComplete={handleSpinComplete}
            onCancel={() => { stopSpeaking(); setView("dashboard"); }}
          />
        );
      }

      // Centralized navigation helper that routes special views correctly
      const handleNav = (v) => {
        if (v === "team") return navigateToTeam();
        if (v === "manager") {
          if (managerUnlocked) {
            setView("manager");
            if (!teamProfiles.length || !teamReports.length) loadTeamData();
          } else {
            setManagerPwModalOpen(true);
          }
          return;
        }
        setView(v);
      };

      return (
        <div className="min-h-screen paper-bg">
          {/* Manager-mode indicator strip — visible whenever the user is unlocked, on every page */}
          {managerUnlocked && (
            <div className="px-8 py-1.5 text-center text-[10px] uppercase tracking-[0.3em] font-medium" style={{ background: "#b8893a", color: "white", letterSpacing: "0.3em" }}>
              🔓 Manager Mode Active · Press Ctrl+Alt+M anytime · You can see all advisors' data
            </div>
          )}

          <TopNav user={user} onSignOut={handleSignOut} onNavigate={handleNav} currentView={view} managerUnlocked={managerUnlocked} />
          {view === "dashboard" && (
            <DashboardView
              user={user}
              mode={mode}
              setMode={setMode}
              reports={reports}
              onStartSession={handleStartSession}
              onViewReport={(id) => { if (id) { setCameFromManager(false); setActiveReportId(id); setView("report-card"); } else { setView("history"); } }}
              hasApiKey={!!apiKey}
            />
          )}
          {view === "history" && (
            <HistoryView
              reports={reports}
              onView={(id) => { setCameFromManager(false); setActiveReportId(id); setView("report-card"); }}
              onDelete={handleDeleteReport}
            />
          )}
          {view === "team" && (
            <MyTeamView
              currentUser={user}
              profiles={teamProfiles}
              allReports={teamReports}
              onRefresh={loadTeamData}
            />
          )}
          {view === "manager" && managerUnlocked && (
            <ManagerView
              profiles={teamProfiles}
              allReports={teamReports}
              selectedAdvisorId={managerSelectedAdvisorId}
              setSelectedAdvisorId={setManagerSelectedAdvisorId}
              onViewReport={(id) => { setCameFromManager(true); setActiveReportId(id); setView("report-card"); }}
              onLock={lockManager}
              onRefresh={loadTeamData}
            />
          )}
          {view === "settings" && (
            <SettingsView
              apiKey={apiKey}
              onSaveKey={setApiKey}
              onNavigate={setView}
              voices={voices}
              preferredVoice={preferredVoice}
              onSetVoice={setPreferredVoice}
              speechRate={speechRate}
              onSetSpeechRate={setSpeechRate}
            />
          )}
          {view === "persona-setup" && (
            <PersonaSetupView
              apiKey={apiKey}
              mode={mode}
              onLaunch={handleLaunchSession}
              onCancel={() => setView("dashboard")}
            />
          )}
          {view === "report-card" && activeReport && (
            <ReportCardView
              report={activeReport}
              onBack={() => {
                if (cameFromManager && managerUnlocked) {
                  setView("manager");
                  setCameFromManager(false);
                } else {
                  setView("dashboard");
                }
              }}
              user={user}
              allReports={reports}
              apiKey={apiKey}
              onDelete={handleDeleteReport}
            />
          )}

          {/* Manager password modal — appears when triggered by keyboard shortcut or tab click */}
          {managerPwModalOpen && (
            <ManagerPasswordModal
              onUnlock={unlockManager}
              onClose={() => setManagerPwModalOpen(false)}
            />
          )}
        </div>
      );
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
