  <style>
    :root {
      /* Corbett Road brand colors */
      --teal: #216561;
      --teal-deep: #1a4f4c;
      --teal-soft: #3a8a85;
      --grey-dark: #5f6062;
      --grey-light: #b6b8ba;
      --grey-bg: #e8e8e9;
      --grey-page: #f1f1f2;

      /* Semantic CSS vars (names kept stable so component code is unchanged) */
      --ink: #5f6062;            /* primary text — dark grey */
      --ink-soft: #4a4b4d;       /* hover/active state */
      --parchment: #ffffff;      /* "warm" surface — now clean white */
      --parchment-dim: #f1f1f2;  /* dim warm surface */
      --cream: #f7f7f8;          /* page background — soft light grey */
      --gold: #216561;           /* accent — now teal */
      --gold-soft: #3a8a85;      /* lighter accent — soft teal */
      --accent: #a83232;         /* warning / negative — restrained red */
      --rule: rgba(95, 96, 98, 0.18);
    }

    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Source Sans 3', 'Myriad Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-display {
      font-family: 'Source Serif 4', 'Myriad Pro', Georgia, serif;
      font-feature-settings: "ss01";
      letter-spacing: -0.01em;
      color: var(--grey-dark);
    }

    .font-mono {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
    }

    /* Subtle paper texture */
    .paper-bg {
      background-color: var(--cream);
      background-image:
        radial-gradient(at 20% 10%, rgba(33, 101, 97, 0.05) 0px, transparent 50%),
        radial-gradient(at 80% 90%, rgba(95, 96, 98, 0.04) 0px, transparent 50%);
    }

    .ink-bg {
      background: var(--teal);
      color: white;
    }
    .ink-bg .font-display {
      color: white;
    }

    .gold-rule {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }

    .btn-primary {
      background: var(--teal);
      color: white;
      transition: all 0.2s ease;
      border: 1px solid var(--teal);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--teal-deep);
      border-color: var(--teal-deep);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(33, 101, 97, 0.22);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--rule);
      transition: all 0.2s ease;
    }
    .btn-ghost:hover {
      background: rgba(95, 96, 98, 0.05);
      border-color: var(--ink);
    }

    .btn-gold {
      background: var(--teal);
      color: white;
      border: 1px solid var(--teal);
      transition: all 0.2s ease;
    }
    .btn-gold:hover:not(:disabled) {
      background: var(--teal-deep);
      border-color: var(--teal-deep);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(33, 101, 97, 0.22);
    }

    .input-field {
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--rule);
      color: var(--ink);
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--teal);
      background: white;
      box-shadow: 0 0 0 3px rgba(33, 101, 97, 0.1);
    }

    .card {
      background: white;
      border: 1px solid var(--rule);
      border-radius: 4px;
    }

    .card-warm {
      background: rgba(33, 101, 97, 0.04);
      border: 1px solid rgba(33, 101, 97, 0.15);
      border-radius: 4px;
    }

    /* Pulsing mic indicator */
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: pulse-ring 1.5s ease-out infinite;
    }
    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: pulse-ring 1.5s ease-out 0.5s infinite;
    }

    /* Speaking waveform */
    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
    .wave-bar {
      animation: wave 0.8s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; }

    /* Reveal animation */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up {
      animation: fade-up 0.4s ease-out both;
    }

    /* Score bar animation */
    @keyframes fill-bar {
      from { width: 0; }
    }
    .score-bar-fill {
      animation: fill-bar 1s ease-out;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(95,96,98,0.25); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(95,96,98,0.45); }

    /* Mode toggle */
    .mode-toggle {
      background: rgba(95, 96, 98, 0.08);
      border-radius: 999px;
      padding: 4px;
      display: inline-flex;
    }
    .mode-toggle button {
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 0.2s ease;
      color: var(--ink);
      background: transparent;
    }
    .mode-toggle button.active {
      background: var(--teal);
      color: white;
    }
  </style>

    const SUPABASE_URL = "https://gaiafozfuognlfuuegbt.supabase.co";

    const DIFFICULTY_INSTRUCTIONS = {
      Easy: `DIFFICULTY: EASY — You are an easy-going, trusting prospect. The advisor across from you is newer, and you should be helpful in a way that lets them practice. Specifically:
- Volunteer information freely. If asked a vague question, give a thoughtful, expansive answer.
- When the advisor asks about your goals or concerns, share them openly. Don't make them dig.
- Accept reasonable explanations without heavy pushback. You're the kind of prospect who came in already inclined to like them.
- Gently nudge the advisor along if they seem stuck — drop hints about what you care about.
- Don't ask hard challenging questions about fees or strategy unless they make a clear mistake.
- Tone: warm, cooperative, slightly enthusiastic.`,

      Medium: `DIFFICULTY: MEDIUM — You are a realistic prospect: open but appropriately skeptical. Specifically:
- Ask questions and raise concerns naturally, but don't be hostile.
- Occasionally push back if something feels off, but accept good answers.
- Reveal information when asked thoughtful questions, but don't volunteer everything.
- Have one or two specific concerns you care about — bring them up when relevant.
- Tone: professional, curious, evaluating but fair.`,

      Hard: `DIFFICULTY: HARD — You are a difficult, sophisticated, and skeptical prospect. You've been burned by an advisor before and you're protective of your money. You've done your research. You ask sharp questions across EVERY area, not just one. Specifically, push hard on all of the following whenever they come up:

- **PROCESS**: "Walk me through your actual process. What's the first 90 days look like? Who am I working with — you or some junior associate?" "What happens when you're on vacation?" "How often will we meet — and is that calendar time or actual review time?"
- **FEES**: "What does this actually cost me, all-in? AUM fee, transaction fees, fund expenses, custodian fees — give me the total." "How is your fee structure better than Vanguard's 0.04% or a robo-advisor's 0.25%?" "Are there any fees I won't see on my statement?"
- **BENEFITS**: "Why should I pay 1% to you when I could DIY this for almost free?" "What do I actually get for that fee that I couldn't get from Schwab or Fidelity for less?"
- **RETURNS & PERFORMANCE**: "What's your average client return, net of fees, over the last 5 years? 10 years?" "Compared to what benchmark?" "How did your clients do in 2008? In 2020? In 2022?"
- **CREDENTIALS**: "What are your actual credentials — CFP, CFA, what?" "How long have you been doing this?" "What's your team's experience with someone in my situation?"
- **CONFLICTS OF INTEREST**: "Are you a fiduciary 100% of the time, or only when it's convenient?" "Do you receive any commissions, kickbacks, or revenue sharing from any products you'd recommend?" "Why is this firm a better choice than the last one I just left?"
- **COMMUNICATION & REPORTING**: "How will I know what's happening with my money between meetings?" "What does your reporting look like? Show me an example." "Who do I call when something goes wrong at 9pm on a Sunday?"
- **PHILOSOPHY**: "What's your investment philosophy in plain English?" "Active or passive? Why?" "What do you think the market does in the next 12 months?" (push back on whatever they say)

Behavioral rules:
- Don't volunteer information. Make the advisor work for it. Give terse answers when asked vague questions.
- Express doubt on broad claims. Demand specifics, evidence, examples.
- If they use jargon, call it out: "What does 'tax-loss harvesting' actually mean for someone like me?"
- Interrupt yourself with a new concern occasionally, jumping topics — that's how skeptical clients actually behave.
- You can warm up if the advisor handles you well across multiple areas — but they have to earn it across PROCESS, FEES, RETURNS, and CONFLICTS, not just one.
- Tone: skeptical, demanding, direct, occasionally cold. Not rude, but not friendly until earned.`,
    };

    const CURRICULUM_STEPS = {
      meeting_introduction: {
        label: "Meeting Introduction",
        order: 1,
        scenario: "This is the very start of the meeting. You and the prospect have just sat down. The prospect is waiting for you to open.",
        prospectPrimer: "You've just sat down across from the advisor. You're waiting for them to take the lead and open the meeting professionally.",
        focus: "Practice opening the meeting warmly, setting the agenda, establishing credibility, and making the prospect comfortable.",
      },
      profiling: {
        label: "Profiling the Prospect",
        order: 2,
        scenario: "Introductions are over. You and the prospect have exchanged pleasantries — now it's time to learn about them.",
        prospectPrimer: "Introductions are done. You've said something brief like 'Yeah, glad to be here. Where would you like to start?' — and now you're waiting to be asked thoughtful questions about your situation.",
        focus: "Practice asking situation questions to understand the prospect's life, work, family, financial situation. Don't pitch — just learn.",
      },
      uncovering_problems: {
        label: "Uncovering Key Problems & Concerns",
        order: 3,
        scenario: "You've gathered the basics about the prospect — their job, family, retirement timeline, current investments. Now you need to uncover their REAL concerns and pain points.",
        prospectPrimer: "The advisor has already learned the basics about you (job, family, retirement timeframe, current portfolio). You haven't yet revealed your deeper concerns. Begin by giving a brief recap of one piece of your situation, then wait for the advisor to probe deeper.",
        focus: "Practice probing for real concerns and pain points beneath the surface. Use problem questions to surface what's actually worrying them.",
      },
      reviewing_implications: {
        label: "Reviewing Implications",
        order: 4,
        scenario: "The prospect has shared a real concern. Now you need to explore what that concern would mean — financially, emotionally, for their family — if it's not addressed.",
        prospectPrimer: "The advisor knows your basics and you've just shared one specific concern (e.g., 'I'm not sure if I'll have enough to retire when I want to' or 'I'm worried about taxes eating into what I leave my kids'). You haven't yet thought through what that concern would actually mean if it played out. Wait for the advisor to help you explore it.",
        focus: "Practice asking implication questions that help the prospect feel the weight of their concerns — emotional, financial, family impact.",
      },
      providing_solutions: {
        label: "Providing Clear Solutions",
        order: 5,
        scenario: "You understand the prospect's situation, their concerns, and the implications. Now present clear, tailored solutions that connect Corbett Road's services to what they specifically said.",
        prospectPrimer: "The advisor understands your situation and your concerns. You've explored the implications together. Now you're sitting back, looking at them, and you ask something like: 'So... what would you actually do for me?' Wait for them to present solutions tailored to what you've shared.",
        focus: "Practice presenting solutions that explicitly tie back to what the prospect said. Avoid generic feature lists. Connect each service to a specific concern.",
      },
      call_to_action: {
        label: "Call to Action & Next Steps",
        order: 6,
        scenario: "Solutions are presented. The prospect seems interested but hasn't committed. Now move them to a specific next step.",
        prospectPrimer: "The advisor has presented solutions and you're interested but cautious. You say something like: 'This sounds promising... so what's the next step?' or 'I need to think about it.' Wait for them to propose a clear, low-friction next step.",
        focus: "Practice asking for a specific commitment — schedule a follow-up, send a plan, gather documents. Make the next step easy to say yes to.",
      },
      wrap_up: {
        label: "Meeting Wrap-Up",
        order: 7,
        scenario: "Next steps are agreed. Now wrap up the meeting professionally — summarize, reinforce the relationship, leave the door open.",
        prospectPrimer: "You've agreed on next steps. The meeting is winding down. You say something like: 'Great, I think this was helpful.' Wait for the advisor to wrap things up professionally.",
        focus: "Practice summarizing what was agreed, expressing genuine appreciation, and leaving with warm professionalism.",
      },
    };

    const buildProspectSystemPrompt = (persona) => {
      const difficulty = persona.difficulty || "Medium";
      const difficultyBlock = DIFFICULTY_INSTRUCTIONS[difficulty] || DIFFICULTY_INSTRUCTIONS.Medium;

      let curriculumBlock = "";
      if (persona.focusStep && CURRICULUM_STEPS[persona.focusStep]) {
        const step = CURRICULUM_STEPS[persona.focusStep];
        curriculumBlock = `

CURRICULUM MODE — FOCUSED PRACTICE:
The advisor is practicing a single step of the pitch process: "${step.label}".
SCENARIO PRIMER: ${step.prospectPrimer}
Open the conversation with one short turn that puts the advisor at this step in the pitch — NOT at the very beginning. Don't introduce yourself again or say hello unless the step is "Meeting Introduction". Just pick up mid-conversation as the primer describes.
This will be a SHORT focused session (~3-5 minutes). Stay engaged and let them practice this step.`;
      }

      return `You are role-playing as a prospective wealth management client meeting a financial advisor from Corbett Road Wealth Management. You are evaluating whether to hire them.

YOUR CHARACTER DETAILS:
- Name: ${persona.name || "[invent a realistic name]"}
- Age: ${persona.age || "[invent — typically 45–70]"}
- Retirement timeframe: ${persona.retirement || "[invent]"}
- What you want in retirement: ${persona.retirementGoals || "[invent realistic lifestyle goals]"}
- Current investment strategies: ${persona.currentStrategies || "[invent — e.g. 401k, some individual stocks, savings account]"}
- Primary financial goal: ${persona.primaryGoal || "[invent]"}
- Investing comfort level: ${persona.comfortLevel || "[invent — conservative, moderate, or aggressive]"}
- Estimated time before pulling money from savings: ${persona.pullTime || "[invent]"}
- Current monthly savings: ${persona.monthlySavings || "[invent realistic figure]"}
- Current household income: ${persona.income || "[invent realistic figure]"}
- Current investable assets: ${persona.assets || "[invent realistic figure]"}

ADDITIONAL CONTEXT FROM USER (if any): ${persona.notes || "(none)"}

${difficultyBlock}
${curriculumBlock}

CRITICAL RULES — READ CAREFULLY:
1. Stay in character as this prospect at all times. Never break character. Never mention you are an AI.
2. Do NOT coach the advisor. Do NOT provide feedback. You are the prospect, not a coach.
3. Fill in gaps in your background by inventing realistic, consistent details as needed. Remember what you've said and stay consistent.
4. Speak naturally. Keep responses concise — usually 1–3 sentences. This is a real conversation.
5. Use natural speech patterns — fillers, hesitations, "yeah", "well", "honestly" — like a real person speaking out loud. Avoid lists and bullet points.
6. If the advisor asks something you wouldn't reasonably know, say so naturally ("I'd have to check on that").
7. When the advisor thanks you and asks for feedback, that signals the end. Do NOT switch into coach mode — the system will handle the report card separately.
8. Never use markdown formatting. Just speak.

${persona.focusStep ? "Open the conversation now per the curriculum primer above." : "Begin the conversation as the prospect. Wait for the advisor to start, then respond naturally."}`;
    };

    const buildCoachSystemPrompt = () => `You are a senior sales coach observing a financial advisor's pitch to a prospect in real time. Your job is to suggest what an EXPERT advisor would say next, based on what the prospect just said.

Use SPIN selling principles (Situation, Problem, Implication, Need-Payoff) and consultative sales best practices. Reward:
- Asking discovery questions before pitching
- Uncovering implications and emotional drivers
- Building rapport before solutioning
- Avoiding jargon and pressure tactics
- Tying solutions to the prospect's specific stated concerns

Provide a brief, specific, conversational suggestion of what the advisor should say next. 2–3 sentences max. Sound natural, not scripted. Do not use markdown. Do not preface with "You should..." — just give the actual words.`;

    const buildGraderSystemPrompt = (persona, transcript) => {
      const difficulty = persona.difficulty || "Medium";
      const focusStep = persona.focusStep;
      const focusBlock = focusStep && CURRICULUM_STEPS[focusStep] ? `

CURRICULUM MODE — FOCUSED PRACTICE:
This was a focused practice session on a single step: "${CURRICULUM_STEPS[focusStep].label}".
${CURRICULUM_STEPS[focusStep].focus}
The conversation may have been short by design. Score generously on the steps that weren't the focus (give a default of 6/10 if there wasn't enough material to grade), but score the FOCUSED step rigorously and provide detailed evidence.` : "";

      return `You are a senior sales coach reviewing a financial advisor's pitch to a prospective wealth management client. Score the pitch and provide evidence-based feedback.

PROSPECT PROFILE:
${JSON.stringify(persona, null, 2)}

DIFFICULTY LEVEL: ${difficulty}
${difficulty === "Easy" ? "(The prospect was set to easy mode — they were cooperative and helpful. Adjust your scoring accordingly: don't reward the advisor for getting cooperation that was given freely.)" : ""}
${difficulty === "Hard" ? "(The prospect was set to hard mode — they pushed back, asked challenging questions about fees, and were skeptical. Reward the advisor for handling difficulty well.)" : ""}
${focusBlock}

FULL TRANSCRIPT:
${transcript}

Score the advisor 1–10 in each of these 7 categories. For each score, cite a SPECIFIC moment from the transcript as evidence (quote a phrase or describe what was said/missed). Be honest — most real pitches score 5–7. Reserve 9–10 for genuine excellence.

Categories:
1. Meeting Introduction — Did the advisor open warmly, set the agenda, and establish credibility?
2. Profiling the Prospect — Did the advisor ask thoughtful situation questions to understand the prospect's life, goals, family, work?
3. Uncovering and Identifying Key Problems/Concerns — Did the advisor surface the prospect's real worries, gaps, or motivations?
4. Reviewing the Implications of the Problems/Concerns — Did the advisor explore what those problems would mean if unaddressed (financial, emotional, family impact)?
5. Providing a Clear Solution(s) or Offer(s) — Did the advisor connect Corbett Road's services to the prospect's specific stated concerns?
6. Giving the Prospect a Call To Action and Actionable Next Steps — Did the advisor ask for a concrete commitment or next step?
7. Meeting Wrap-Up — Did the advisor close professionally, summarize, and leave the door open?

Also provide qualitative feedback on:
- Cadence
- Conversational flow
- Format
- Knowledge demonstrated
- Referencing specific client concerns/objections
- Building rapport
- Confidence
- Delivery

Return ONLY valid JSON in this exact shape (no markdown, no commentary outside JSON):
{
  "scores": {
    "meeting_introduction":         { "score": 0, "evidence": "", "reasoning": "" },
    "profiling":                    { "score": 0, "evidence": "", "reasoning": "" },
    "uncovering_problems":          { "score": 0, "evidence": "", "reasoning": "" },

    "wrap_up":                      { "score": 0, "evidence": "", "reasoning": "" }
  },

    "cadence":              "",
    "conversational_flow":  "",
    "format":               "",
    "knowledge":            "",
    "referencing_concerns": "",
    "rapport":              "",

  },
  "summary": "2–4 sentence overall assessment. Honest, professional, succinct.",
  "top_strengths": ["", "", ""],
  "top_growth_areas": ["", "", ""]
}`;
    };

    const buildPersonaGenPrompt = () => `Generate a realistic prospective wealth management client for a financial advisor training simulation. The prospect should be a believable real person with a coherent financial situation. Vary the profile (don't always pick a tech executive). Mix in business owners, dual-income professionals, recent inheritors, pre-retirees, divorcees, etc.

Return ONLY valid JSON in this exact shape (no commentary):
{
  "name": "First Last",
  "age": "number as string",
  "retirement": "e.g. 'about 8 years' or 'already retired 2 years' ",
  "retirementGoals": "what they want to do — 1 sentence",

    // ======================================================================
    // SPIN MODE — objection drill library + prompt builders
    // ======================================================================

    const SPIN_QUESTIONS = {
      Easy: [
        { category: "Fees", text: "I'm a little concerned about the fee. Can you walk me through what I'm actually paying for?" },
        { category: "Process", text: "How often will we actually be in touch once I sign on?" },
        { category: "Returns", text: "What kind of returns can I expect over the long run?" },
        { category: "Trust", text: "I just want to make sure my money is safe. How do you protect against losses?" },
        { category: "Comparison", text: "What makes you different from the other advisors I've spoken to?" },
        { category: "Onboarding", text: "How long does it take to actually get everything set up if I decide to move my money over?" },
        { category: "Service", text: "Will I always be working with you, or will I get passed off to someone else?" },
        { category: "Comfort", text: "I've never worked with an advisor before. What does the relationship look like?" },
        { category: "Goals", text: "I'm not sure I have specific financial goals. Is that a problem?" },

    function pickSpinQuestion(difficulty, recentlyAsked = []) {
      const pool = SPIN_QUESTIONS[difficulty] || SPIN_QUESTIONS.Medium;
      // Avoid the most recent ~5 questions if possible
      const available = pool.filter(q => !recentlyAsked.slice(-5).includes(q.text));
      const finalPool = available.length > 0 ? available : pool;
      return finalPool[Math.floor(Math.random() * finalPool.length)];
    }

    async function callGroq({ apiKey, model, messages, temperature = 0.7, jsonMode = false }) {
      const body = {
        model,
        messages,
        temperature,
      };
      if (jsonMode) {
        body.response_format = { type: "json_object" };
      }

      const res = await fetch(GROQ_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`,
        },
        body: JSON.stringify(body),
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Groq API error ${res.status}: ${errText}`);
      }

      const data = await res.json();
      return data.choices?.[0]?.message?.content || "";
    }

    // Save a report card to the cloud
    async function saveReportToCloud(userId, report) {
      const row = {
        user_id: userId,
        mode: report.mode,
        persona: report.persona || null,
        transcript: report.transcript || [],
        card: report.card ? { ...report.card, voiceAnalytics: report.voiceAnalytics || null } : (report.voiceAnalytics ? { voiceAnalytics: report.voiceAnalytics } : null),
        created_at: new Date(report.createdAt || Date.now()).toISOString(),
      };
      const { error } = await sb.from("report_cards").insert(row);
      if (error) throw error;
    }

    // Delete a report card from the cloud
    async function deleteReportFromCloud(reportId) {
      const { error } = await sb.from("report_cards").delete().eq("id", reportId);
      if (error) throw error;
    }

    // Convert a database row into our app's report shape
    function rowToReport(row) {
      const card = row.card || null;
      // Voice analytics may be embedded in the card field (since we don't have a dedicated DB column)
      const voiceAnalytics = card && card.voiceAnalytics ? card.voiceAnalytics : null;
      // Strip voiceAnalytics from card so display logic still works as expected
      const cleanCard = card ? { ...card } : null;
      if (cleanCard) delete cleanCard.voiceAnalytics;
      return {
        id: row.id,
        userId: row.user_id,
        mode: row.mode,
        persona: row.persona,
        transcript: row.transcript || [],
        card: cleanCard,
        voiceAnalytics,
        createdAt: new Date(row.created_at).getTime(),
      };
    }

    // Migrate any pre-Supabase localStorage reports to the cloud (one-time)
    async function migrateLocalReportsIfNeeded(userId) {
      if (storage.get(STORAGE_KEYS.migrationComplete)) return;
      const local = storage.get(STORAGE_KEYS.reports, []);
      if (!Array.isArray(local) || local.length === 0) {
        storage.set(STORAGE_KEYS.migrationComplete, true);
        return;
      }
      console.log(`Migrating ${local.length} local reports to cloud...`);
      let migrated = 0;
      for (const r of local) {
        try {
          await saveReportToCloud(userId, r);
          migrated++;
        } catch (e) {
          console.warn("Failed to migrate one report:", e);
        }
      }
      storage.set(STORAGE_KEYS.migrationComplete, true);
      console.log(`Migration complete: ${migrated}/${local.length} reports.`);
    }

    function getSpeechRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      return rec;
    }

    function getBestVoice(preferredName) {
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;
      if (preferredName) {
        const match = voices.find(v => v.name === preferredName);
        if (match) return match;
      }
      // Prefer a natural-sounding English voice; weight Google voices first
      const en = voices.filter(v => v.lang.startsWith("en"));
      const preferred = en.find(v => /Google US English/i.test(v.name)) ||
                        en.find(v => /Microsoft.*(Aria|Jenny|Guy|Davis|Tony)/i.test(v.name)) ||
                        en.find(v => /Samantha|Alex|Daniel|Karen/i.test(v.name)) ||
                        en[0];
      return preferred || voices[0];
    }

    function speak({ text, voice, rate, onStart, onEnd }) {
      return new Promise((resolve) => {
        if (!text || !text.trim()) { resolve(); return; }
        const utter = new SpeechSynthesisUtterance(text);
        if (voice) utter.voice = voice;
        // Clamp rate to a sensible range (browser allows 0.1–10 but quality degrades outside ~0.75–2.0)
        const safeRate = typeof rate === "number" && !isNaN(rate) ? Math.max(0.5, Math.min(2.0, rate)) : 1.0;
        utter.rate = safeRate;
        utter.pitch = 1.0;
        utter.onstart = () => { if (onStart) onStart(); };
        utter.onend = () => { if (onEnd) onEnd(); resolve(); };
        utter.onerror = () => { if (onEnd) onEnd(); resolve(); };
        window.speechSynthesis.speak(utter);
      });
    }

    function stopSpeaking() {
      try { window.speechSynthesis.cancel(); } catch {}
    }

    function detectBrowser() {
      const ua = navigator.userAgent;
      // Order matters — Edge & Opera both contain "Chrome" in UA, so check them first
      if (/Edg\//.test(ua)) return "Edge";
      if (/OPR\//.test(ua) || /Opera/.test(ua)) return "Opera";
      if (/Brave/.test(ua) || (navigator.brave && navigator.brave.isBrave)) return "Brave";
      if (/Firefox\//.test(ua)) return "Firefox";
      if (/Chrome\//.test(ua)) return "Chrome";
      if (/Safari\//.test(ua)) return "Safari";
      return "an unsupported browser";
    }

    async function hashPasscode(email, passcode) {
      const data = new TextEncoder().encode(`${email.toLowerCase()}:${passcode}`);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    }

    // ======================================================================
    // VOICE ANALYTICS — compute speech metrics from transcript
    // ======================================================================

    function computeVoiceAnalytics(transcript) {
      if (!transcript || transcript.length === 0) return null;

      const advisorTurns = transcript.filter(t => t.role === "advisor");
      const prospectTurns = transcript.filter(t => t.role === "prospect");

      const wordsOf = (text) => text.toLowerCase().split(/\s+/).filter(w => w.length > 0);

      const advisorWords = advisorTurns.flatMap(t => wordsOf(t.text));
      const prospectWords = prospectTurns.flatMap(t => wordsOf(t.text));

      const totalAdvisorWords = advisorWords.length;
      const totalProspectWords = prospectWords.length;
      const totalWords = totalAdvisorWords + totalProspectWords;
      const talkRatio = totalWords > 0 ? totalAdvisorWords / totalWords : 0;

      // Filler word detection
      const fillerCount = {};
      // Single-word fillers (need exact word match, ignoring punctuation)
      const singleFillers = ["um", "uh", "uhm", "er", "ah", "like", "basically", "literally", "actually", "honestly"];
      singleFillers.forEach(filler => { fillerCount[filler] = 0; });
      advisorWords.forEach(w => {
        const clean = w.replace(/[.,!?;:'"]/g, "");
        if (singleFillers.includes(clean)) fillerCount[clean] += 1;
      });

      // Multi-word fillers (regex on the joined text)
      const advisorText = advisorTurns.map(t => t.text.toLowerCase()).join(" ");
      const multiFillers = ["you know", "kind of", "sort of", "i mean", "i guess"];
      multiFillers.forEach(filler => {
        const escaped = filler.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const matches = advisorText.match(new RegExp(`\\b${escaped}\\b`, "g")) || [];
        fillerCount[filler] = matches.length;
      });

      const totalFillers = Object.values(fillerCount).reduce((a, b) => a + b, 0);
      const fillerPercentage = totalAdvisorWords > 0 ? (totalFillers / totalAdvisorWords) * 100 : 0;

      const topFillers = Object.entries(fillerCount)
        .filter(([_, count]) => count > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      const sessionDurationMs = transcript.length > 0
        ? transcript[transcript.length - 1].ts - transcript[0].ts
        : 0;
      const sessionDurationMin = sessionDurationMs / 1000 / 60;

      return {
        totalAdvisorWords,
        totalProspectWords,
        talkRatio,
        fillerCount: totalFillers,
        fillerPercentage,
        topFillers,
        averageTurnWords: advisorTurns.length > 0 ? Math.round(totalAdvisorWords / advisorTurns.length) : 0,
        advisorTurnCount: advisorTurns.length,
        prospectTurnCount: prospectTurns.length,
        sessionDurationMin,
      };
    }

    // ======================================================================
    // LOGIN VIEW — Supabase Auth (email + password)
    // ======================================================================

    function LoginView({ onSignIn }) {
      const [step, setStep] = useState("email"); // "email" | "signin" | "signup"
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [showPassword, setShowPassword] = useState(false);
      const [error, setError] = useState("");
      const [info, setInfo] = useState("");
      const [busy, setBusy] = useState(false);

      const submitEmail = async (e) => {
        e.preventDefault();
        setError(""); setInfo("");
        const trimmed = email.trim().toLowerCase();
        if (!trimmed) { setError("Please enter your email."); return; }
        if (!trimmed.includes("@") || !trimmed.endsWith("@" + COMPANY_DOMAIN)) {
          setError(`Use your @${COMPANY_DOMAIN} email address.`);
          return;
        }
        setEmail(trimmed);

        // Check if a previous (pre-Supabase) registration exists locally for this email
        // → if so, this is a returning user we want to sign in
        // → otherwise show signup
        const previouslyRegistered = storage.get(STORAGE_KEYS.registeredEmail);
        if (previouslyRegistered && previouslyRegistered.toLowerCase() === trimmed) {
          setInfo("Welcome back. We've upgraded the app — please sign in or create an account if you haven't already.");
        }
        // Always show signin first for returning users; they can switch to signup if needed
        setStep("signin");
      };

      const submitSignIn = async (e) => {
        e.preventDefault();
        setError(""); setInfo("");
        if (!password) { setError("Enter your password."); return; }
        setBusy(true);
        try {
          const { data, error: authError } = await sb.auth.signInWithPassword({
            email,
            password,
          });
          if (authError) {
            // Friendly error messages
            if (/Invalid login credentials/i.test(authError.message)) {
              setError("Email or password is incorrect. If you haven't created an account yet, click 'Create new account' below.");
            } else {
              setError(authError.message);
            }
            setBusy(false);
            return;
          }
          // Supabase auth state listener in App will handle the actual sign-in
          // We just don't do anything else here — the listener takes over
        } catch (err) {
          setError("Something went wrong. Please try again.");
          setBusy(false);
        }
      };

      const submitSignUp = async (e) => {
        e.preventDefault();
        setError(""); setInfo("");
        if (password.length < 6) { setError("Password must be at least 6 characters."); return; }
        if (password !== confirmPassword) { setError("Passwords don't match."); return; }
        setBusy(true);
        try {
          const { data, error: authError } = await sb.auth.signUp({
            email,
            password,
          });
          if (authError) {
            if (/already registered/i.test(authError.message) || /already been registered/i.test(authError.message)) {
              setError("An account already exists for this email. Click 'Sign in instead' below.");
            } else {
              setError(authError.message);
            }
            setBusy(false);
            return;
          }
          // App's auth listener will pick up the new session and route the user forward
        } catch (err) {
          setError("Something went wrong. Please try again.");
          setBusy(false);
        }
      };

      const editEmail = () => {
        setStep("email");
        setPassword(""); setConfirmPassword("");
        setError(""); setInfo("");
      };

      const switchToSignUp = () => {
        setStep("signup");
        setPassword(""); setConfirmPassword("");
        setError(""); setInfo("");
      };

      const switchToSignIn = () => {
        setStep("signin");
        setPassword(""); setConfirmPassword("");
        setError(""); setInfo("");
      };

      const switchToForgot = () => {
        setStep("forgot");
        setError(""); setInfo("");
      };

      return (
        <div className="min-h-screen paper-bg flex">
          {/* Left brand panel */}
          <div className="hidden md:flex md:w-1/2 ink-bg p-12 flex-col justify-between relative overflow-hidden">
            <div className="absolute -bottom-20 -right-20 w-96 h-96 rounded-full opacity-15" style={{ background: "white" }}></div>

    function OnboardingView({ user, onComplete, onSignOut, voices }) {

      const [apiKey, setApiKey] = useState("");
      const [testStatus, setTestStatus] = useState(null); // null | 'testing' | 'ok' | { error }
      const [preferredVoice, setPreferredVoice] = useState("");

      const test = async () => {
        if (!apiKey.trim()) return;
        setTestStatus("testing");
        try {
          await callGroq({
            apiKey: apiKey.trim(),
            model: MODEL_PROSPECT,
            messages: [{ role: "user", content: "Say the single word: ready" }],
            temperature: 0,
          });
          setTestStatus("ok");
        } catch (e) {
          setTestStatus({ error: e.message });
        }
      };

      const finish = () => {
        onComplete({ apiKey: apiKey.trim(), voice: preferredVoice });
      };

        <div className="flex items-center gap-3 mb-12">
          {[1, 2, 3].map(n => (
            <React.Fragment key={n}>
              <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium transition-all ${
                step === n ? "ink-bg" : step > n ? "bg-[var(--gold)] text-[var(--cream)]" : "border border-[var(--rule)] text-[var(--ink)]/40"
              }`}>
                {step > n ? "✓" : n}

              {n < 3 && <div className="flex-1 h-px max-w-16" style={{ background: step > n ? "var(--gold)" : "var(--rule)" }}></div>}

    function SettingsView({ apiKey, onSaveKey, onNavigate, voices, preferredVoice, onSetVoice, speechRate, onSetSpeechRate }) {
      const [draft, setDraft] = useState(apiKey || "");
      const [savedToast, setSavedToast] = useState(false);
      const [testStatus, setTestStatus] = useState(null); // null | 'testing' | 'ok' | { error }

      // Change password state
      const [newPassword, setNewPassword] = useState("");
      const [confirmNewPassword, setConfirmNewPassword] = useState("");
      const [showNewPassword, setShowNewPassword] = useState(false);
      const [pwStatus, setPwStatus] = useState(null); // null | 'updating' | 'ok' | { error }

      const save = () => {
        onSaveKey(draft.trim());
        setSavedToast(true);
        setTimeout(() => setSavedToast(false), 2000);
      };

      const updatePassword = async () => {
        setPwStatus(null);
        if (newPassword.length < 6) { setPwStatus({ error: "Password must be at least 6 characters." }); return; }
        if (newPassword !== confirmNewPassword) { setPwStatus({ error: "Passwords don't match." }); return; }
        setPwStatus("updating");
        try {
          const { error } = await sb.auth.updateUser({ password: newPassword });
          if (error) {
            setPwStatus({ error: error.message });
            return;
          }
          setPwStatus("ok");
          setNewPassword(""); setConfirmNewPassword("");
          setTimeout(() => setPwStatus(null), 4000);
        } catch (e) {
          setPwStatus({ error: e.message || "Couldn't update password." });
        }
      };

      const test = async () => {
        setTestStatus("testing");
        try {
          const reply = await callGroq({
            apiKey: draft.trim(),
            model: MODEL_PROSPECT,
            messages: [{ role: "user", content: "Say the single word: ready" }],
            temperature: 0,
          });
          setTestStatus("ok");
          console.log("Groq replied:", reply);
        } catch (e) {
          setTestStatus({ error: e.message });
        }
      };

        <div className="max-w-3xl mx-auto px-8 py-12 fade-up">

          <h1 className="font-display text-4xl mb-2">Studio Configuration</h1>

            </p>
            <div className="space-y-3">
              <input

                value={draft}
                onChange={e => { setDraft(e.target.value); setTestStatus(null); }}

              />
              <div className="flex flex-wrap items-center gap-3">
                <button onClick={save} className="btn-primary px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">Save Key</button>
                <button onClick={test} disabled={!draft.trim() || testStatus === "testing"} className="btn-ghost px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">
                  {testStatus === "testing" ? "Testing…" : "Test Connection"}
                </button>
                {savedToast && <span className="text-xs text-[var(--gold)]">✓ Saved</span>}

                    className="input-field w-full px-4 py-3 pr-16 rounded text-sm"
                  />
                  <button
                    type="button"
                    onClick={() => setShowNewPassword(s => !s)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] uppercase tracking-[0.15em] text-[var(--ink)]/50 hover:text-[var(--ink)]"
                  >
                    {showNewPassword ? "Hide" : "Show"}
                  </button>
                </div>
              </div>
              <div>
                <label className="block text-[11px] uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-2">Confirm new password</label>
                <input

            <h3 className="font-display text-lg mb-2">A note on privacy</h3>

                <h2 className="font-display text-4xl mb-3 leading-tight text-white">
                  {mode === "pitch" && "Begin a peer pitch session."}
                  {mode === "practice" && "Begin a guided practice session."}

    function ReportCardSummary({ report, onView, onDelete }) {
      const scores = Object.values(report.card?.scores || {}).map(s => s.score).filter(Boolean);
      const avg = scores.length ? (scores.reduce((a,b) => a+b, 0) / scores.length).toFixed(1) : "—";
      const date = new Date(report.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      const prospectName = report.persona?.name || "Anonymous prospect";

      const handleDelete = async (e) => {
        e.stopPropagation();
        const confirmed = window.confirm(`Delete the session with ${prospectName}? This cannot be undone.`);
        if (!confirmed) return;
        try {
          await onDelete(report.id);
        } catch (err) {
          alert("Couldn't delete: " + err.message);
        }
      };

      return (
        <div className="card p-6 hover:shadow-md transition-shadow w-full relative group">
          <button onClick={onView} className="block text-left w-full">
            <div className="flex items-start justify-between gap-4">
              <div className="min-w-0 pr-8">
                <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--ink)]/50 mb-1">{date} · {report.mode}</div>
                <div className="font-display text-lg truncate">{prospectName}</div>
                <div className="text-xs text-[var(--ink)]/50 mt-1 truncate">{report.persona?.notes || `Age ${report.persona?.age || "?"} · ${report.persona?.primaryGoal || ""}`}</div>
              </div>
              <div className="text-right shrink-0">
                <div className="font-display text-3xl" style={{ color: "var(--gold)" }}>{avg}</div>
                <div className="text-[10px] uppercase tracking-[0.18em] text-[var(--ink)]/50">avg score</div>
              </div>
            </div>
          </button>
          {onDelete && (
            <button
              onClick={handleDelete}
              className="absolute top-3 right-3 w-7 h-7 rounded flex items-center justify-center text-[var(--ink)]/30 hover:text-[var(--accent)] hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100"
              title="Delete this session"
              aria-label="Delete session"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"></path>
                <path d="M10 11v6M14 11v6"></path>
                <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"></path>
              </svg>
            </button>
          )}
        </div>
      );

    // ======================================================================
    // PERSONA SETUP VIEW
    // ======================================================================

    const EMPTY_PERSONA = {
      name: "", age: "", retirement: "", retirementGoals: "",
      currentStrategies: "", primaryGoal: "", comfortLevel: "",
      pullTime: "", monthlySavings: "", income: "", assets: "", notes: "",
      difficulty: "Medium",
      focusStep: null,
    };

    function PersonaSetupView({ apiKey, mode, onLaunch, onCancel }) {
      const [persona, setPersona] = useState(EMPTY_PERSONA);
      const [generating, setGenerating] = useState(false);
      const [error, setError] = useState("");
      // Curriculum mode: pick step first, then prospect
      const [curriculumStep, setCurriculumStep] = useState(null);
      const [curriculumPhase, setCurriculumPhase] = useState(mode === "curriculum" ? "pickStep" : "persona");

      const set = (k, v) => setPersona(p => ({ ...p, [k]: v }));

      const generate = async () => {
        setGenerating(true);
        setError("");
        try {
          const reply = await callGroq({
            apiKey,
            model: MODEL_GRADER,
            messages: [{ role: "user", content: buildPersonaGenPrompt() }],
            temperature: 1.0,
            jsonMode: true,
          });
          const parsed = JSON.parse(reply);
          // Preserve current difficulty + focusStep when generating
          setPersona(p => ({ ...EMPTY_PERSONA, ...parsed, difficulty: p.difficulty, focusStep: p.focusStep }));
        } catch (e) {
          setError("Couldn't generate a prospect. " + e.message);
        } finally {
          setGenerating(false);
        }
      };

      const launch = () => {
        const finalPersona = mode === "curriculum"
          ? { ...persona, focusStep: curriculumStep }
          : persona;
        onLaunch(finalPersona);
      };

      const fields = [
        { key: "name", label: "Name", placeholder: "e.g. Margaret Chen" },
        { key: "age", label: "Age", placeholder: "e.g. 58" },
        { key: "retirement", label: "Retirement timeframe", placeholder: "e.g. 7 years" },
        { key: "retirementGoals", label: "What they want to do in retirement", placeholder: "e.g. Travel, spend time with grandchildren" },
        { key: "currentStrategies", label: "Current investment strategies", placeholder: "e.g. 401k, individual stocks, savings" },
        { key: "primaryGoal", label: "Primary financial goal", placeholder: "e.g. Maintain lifestyle, leave inheritance" },
        { key: "comfortLevel", label: "Investing comfort level", placeholder: "Conservative / Moderate / Aggressive" },
        { key: "pullTime", label: "Time to pulling money", placeholder: "e.g. 5–10 years" },
        { key: "monthlySavings", label: "Current monthly savings", placeholder: "e.g. $4,500" },
        { key: "income", label: "Current household income", placeholder: "e.g. $325,000" },
        { key: "assets", label: "Current investable assets", placeholder: "e.g. $1.8M" },
      ];

      const modeLabel = mode === "pitch" ? "Pitch mode" : mode === "practice" ? "Practice mode" : "Curriculum mode";

      // ===== Curriculum: pick step first =====
      if (mode === "curriculum" && curriculumPhase === "pickStep") {
        return (
          <div className="max-w-4xl mx-auto px-8 py-12 fade-up">
            <button onClick={onCancel} className="text-xs uppercase tracking-[0.18em] text-[var(--ink)]/60 hover:text-[var(--ink)] mb-6">← Cancel</button>
            <div className="text-xs uppercase tracking-[0.25em] text-[var(--ink)]/50 mb-2">Curriculum mode · Step 1 of 2</div>
            <h1 className="font-display text-4xl mb-3">Which step do you want to practice?</h1>
            <p className="text-sm text-[var(--ink)]/60 max-w-2xl mb-8">
              Pick a single step of the seven-step pitch process. The session will be short and focused — the prospect will be primed to put you exactly at that point in the conversation, and grading will weight that step heavily.
            </p>

            <div className="grid md:grid-cols-2 gap-3">
              {Object.entries(CURRICULUM_STEPS).map(([key, step]) => (
                <button
                  key={key}
                  onClick={() => { setCurriculumStep(key); setCurriculumPhase("persona"); }}
                  className={`card p-5 text-left transition-all hover:shadow-md ${curriculumStep === key ? "ring-2 ring-[var(--gold)]" : ""}`}
                >
                  <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--gold)] mb-1">Step {step.order}</div>
                  <div className="font-display text-lg mb-1">{step.label}</div>
                  <div className="text-xs text-[var(--ink)]/60 leading-relaxed">{step.focus}</div>
                </button>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto px-8 py-12 fade-up">
          <button onClick={onCancel} className="text-xs uppercase tracking-[0.18em] text-[var(--ink)]/60 hover:text-[var(--ink)] mb-6">← Cancel</button>
          <div className="text-xs uppercase tracking-[0.25em] text-[var(--ink)]/50 mb-2">
            {modeLabel} · Step {mode === "curriculum" ? "2" : "1"} of 2
            {mode === "curriculum" && curriculumStep && (
              <> · Practicing <span className="text-[var(--gold)]">{CURRICULUM_STEPS[curriculumStep].label}</span></>
            )}
          </div>
          <h1 className="font-display text-4xl mb-3">Set up your prospect.</h1>
          <p className="text-sm text-[var(--ink)]/60 max-w-2xl mb-8">
            Fill in as much or as little as you'd like — the AI will invent realistic details for any gaps. Or click "Generate prospect" for a random scenario.
          </p>

          {/* Difficulty selector — applies to all modes */}
          <div className="card p-6 mb-6">
            <div className="text-[11px] uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-3">Difficulty</div>
            <div className="grid grid-cols-3 gap-3">
              {[
                { value: "Easy", label: "Easy", desc: "Cooperative & helpful — volunteers info and gently guides the advisor along" },
                { value: "Medium", label: "Medium", desc: "Realistic — open but appropriately skeptical, raises a few real concerns" },
                { value: "Hard", label: "Hard", desc: "Demanding — grills you on process, fees, returns, fiduciary status, conflicts, and more" },
              ].map(opt => (
                <button
                  key={opt.value}
                  onClick={() => set("difficulty", opt.value)}
                  className={`p-4 rounded text-left transition-all ${
                    persona.difficulty === opt.value
                      ? "ink-bg"
                      : "border border-[var(--rule)] hover:border-[var(--ink)]"
                  }`}
                >
                  <div className={`font-display text-base mb-1 ${persona.difficulty === opt.value ? "text-[var(--parchment)]" : "text-[var(--ink)]"}`}>
                    {opt.label}
                  </div>
                  <div className={`text-[11px] leading-relaxed ${persona.difficulty === opt.value ? "text-[var(--parchment)]/70" : "text-[var(--ink)]/60"}`}>
                    {opt.desc}
                  </div>
                </button>
              ))}
            </div>
          </div>

          <div className="flex flex-wrap gap-3 mb-8">
            <button onClick={generate} disabled={generating} className="btn-primary px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">
              {generating ? "Generating…" : "✨ Generate Prospect"}
            </button>
            <button onClick={() => setPersona({ ...EMPTY_PERSONA, difficulty: persona.difficulty })} className="btn-ghost px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em]">Clear all</button>
          </div>

          {error && <div className="card-warm p-4 mb-6 text-sm text-[var(--accent)]">{error}</div>}

          <div className="card p-8">
            <div className="grid md:grid-cols-2 gap-x-8 gap-y-5">
              {fields.map(f => (
                <div key={f.key}>
                  <label className="block text-[11px] uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-2">{f.label}</label>
                  <input
                    type="text"
                    value={persona[f.key]}
                    onChange={e => set(f.key, e.target.value)}
                    placeholder={f.placeholder}
                    className="input-field w-full px-3 py-2.5 rounded text-sm"
                  />
                </div>
              ))}
              <div className="md:col-span-2">
                <label className="block text-[11px] uppercase tracking-[0.18em] text-[var(--ink)]/60 mb-2">Additional context (optional)</label>
                <textarea
                  value={persona.notes}
                  onChange={e => set("notes", e.target.value)}
                  placeholder="e.g. Recently widowed. Daughter is pushing her to talk to advisors. Skeptical after a bad experience with another firm."
                  rows={3}
                  className="input-field w-full px-3 py-2.5 rounded text-sm"
                />
              </div>
            </div>
          </div>

          <div className="mt-8 flex justify-end gap-3">
            {mode === "curriculum" ? (
              <button onClick={() => setCurriculumPhase("pickStep")} className="btn-ghost px-6 py-3 rounded text-xs uppercase tracking-[0.18em]">← Pick Different Step</button>
            ) : (
              <button onClick={onCancel} className="btn-ghost px-6 py-3 rounded text-xs uppercase tracking-[0.18em]">Back</button>
            )}
            <button onClick={launch} className="btn-primary px-8 py-3 rounded text-xs uppercase tracking-[0.18em]">
              Begin Session →
            </button>
          </div>
        </div>
      );
    }

    // ======================================================================
    // LIVE SESSION VIEW (the heart of the app)
    // ======================================================================

    function SessionView({ apiKey, mode, persona, voice, speechRate, onComplete, onCancel }) {
      const [transcript, setTranscript] = useState([]); // { role: 'advisor'|'prospect', text, ts }
      const [interimText, setInterimText] = useState("");
      const [currentResponseText, setCurrentResponseText] = useState(""); // accumulated final-text for the in-progress turn
      const [isListening, setIsListening] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isThinking, setIsThinking] = useState(false);
      const [coachSuggestion, setCoachSuggestion] = useState("");
      const [coachLoading, setCoachLoading] = useState(false);
      const [error, setError] = useState("");
      const [sessionStartedAt] = useState(Date.now());
      const [elapsed, setElapsed] = useState(0);

      const recRef = useRef(null);
      const transcriptRef = useRef(transcript);
      const transcriptScrollRef = useRef(null);
      const finalSegmentsRef = useRef([]); // accumulating final segments before sending
      const isSpeakingRef = useRef(false);
      const isListeningRef = useRef(false);
      const personaRef = useRef(persona);
      const apiKeyRef = useRef(apiKey);
      const modeRef = useRef(mode);
      const voiceRef = useRef(voice);
      const speechRateRef = useRef(speechRate);

      useEffect(() => { transcriptRef.current = transcript; }, [transcript]);
      useEffect(() => { isListeningRef.current = isListening; }, [isListening]);
      useEffect(() => { personaRef.current = persona; }, [persona]);
      useEffect(() => { apiKeyRef.current = apiKey; }, [apiKey]);
      useEffect(() => { modeRef.current = mode; }, [mode]);
      useEffect(() => { voiceRef.current = voice; }, [voice]);
      useEffect(() => { speechRateRef.current = speechRate; }, [speechRate]);

      // Elapsed time
      useEffect(() => {
        const t = setInterval(() => setElapsed(Math.floor((Date.now() - sessionStartedAt) / 1000)), 1000);
        return () => clearInterval(t);
      }, [sessionStartedAt]);

      // Auto-scroll transcript
      useEffect(() => {
        if (transcriptScrollRef.current) {
          transcriptScrollRef.current.scrollTop = transcriptScrollRef.current.scrollHeight;
        }
      }, [transcript, interimText]);

      // ---------------- Set up speech recognition ----------------
      useEffect(() => {
        const rec = getSpeechRecognition();
        if (!rec) {
          setError("Your browser doesn't support speech recognition. Please use Chrome or Edge.");
          return;
        }
        recRef.current = rec;

        rec.onresult = (event) => {
          let interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const txt = result[0].transcript;
            if (result.isFinal) {
              finalSegmentsRef.current.push(txt.trim());
              // Update the live display so the advisor sees their response building
              setCurrentResponseText(finalSegmentsRef.current.join(" "));
            } else {
              interim += txt;
            }
          }
          setInterimText(interim);
        };

        rec.onerror = (e) => {
          if (e.error === "no-speech" || e.error === "aborted") return;
          if (e.error === "not-allowed") {
            setError("Microphone access denied. Allow mic permission in Chrome and reload.");
          } else {
            console.warn("STT error", e);
          }
        };

        rec.onend = () => {
          // Auto-restart if we're still in listening mode and bot isn't speaking
          if (isListeningRef.current && !isSpeakingRef.current && recRef.current) {
            try { recRef.current.start(); } catch {}
          }
        };

        return () => {
          try { rec.stop(); } catch {}
        };
      }, []);

      // Start/stop recognition based on isListening
      useEffect(() => {
        if (!recRef.current) return;
        if (isListening && !isSpeaking) {
          try { recRef.current.start(); } catch {}
        } else {
          try { recRef.current.stop(); } catch {}
        }
      }, [isListening, isSpeaking]);

      // ---------------- Conversation loop ----------------

      const commitAdvisorTurn = useCallback(async () => {
        const segments = finalSegmentsRef.current;
        const fullText = (segments.join(" ") + " " + (interimText || "")).trim();
        finalSegmentsRef.current = [];
        setInterimText("");
        setCurrentResponseText("");
        if (!fullText) return;

        // Stop the mic — it'll auto-resume after the prospect's reply
        setIsListening(false);
        try { recRef.current?.stop(); } catch {}

        const newTurn = { role: "advisor", text: fullText, ts: Date.now() };
        const updatedTranscript = [...transcriptRef.current, newTurn];
        setTranscript(updatedTranscript);

        await getProspectReply(updatedTranscript);
      }, [interimText]);

      // Clear the in-progress response without submitting
      const clearCurrentResponse = () => {
        finalSegmentsRef.current = [];
        setCurrentResponseText("");
        setInterimText("");
      };

      const getProspectReply = async (currentTranscript, isRetry = false) => {
        setIsThinking(true);
        try {
          const systemPrompt = buildProspectSystemPrompt(personaRef.current);
          const retryNote = isRetry
            ? "\n\nIMPORTANT: The advisor has chosen to retry their last response. Generate a meaningfully different reaction this time — maybe more skeptical, maybe pulling on a different thread of the conversation, maybe revealing a different concern. Don't repeat what you said before. Same character, fresh response."
            : "";

          const messages = [
            { role: "system", content: systemPrompt + retryNote },
            ...currentTranscript.map(t => ({
              role: t.role === "advisor" ? "user" : "assistant",
              content: t.text,
            })),
          ];

          const reply = await callGroq({
            apiKey: apiKeyRef.current,
            model: MODEL_PROSPECT,
            messages,
            temperature: isRetry ? 1.0 : 0.85,
          });

          const cleaned = reply.replace(/\*+/g, "").trim();
          const newTurn = { role: "prospect", text: cleaned, ts: Date.now() };
          const updated = [...currentTranscript, newTurn];
          setTranscript(updated);
          setIsThinking(false);

          // Speak the reply
          isSpeakingRef.current = true;
          setIsSpeaking(true);
          try { recRef.current?.stop(); } catch {}

          // In practice mode, fetch coach suggestion in parallel
          if (modeRef.current === "practice") {
            getCoachSuggestion(updated);
          }

          await speak({
            text: cleaned,
            voice: getBestVoice(voiceRef.current),
            rate: speechRateRef.current,
            onEnd: () => {
              isSpeakingRef.current = false;
              setIsSpeaking(false);
            },
          });
        } catch (e) {
          setError("Couldn't reach the AI prospect: " + e.message);
          setIsThinking(false);
        }
      };

      // Retry: rewind transcript to BEFORE this prospect turn, regenerate
      const handleTryAgain = async (prospectTurnIndex) => {
        if (isThinking || isSpeaking) return;
        // Stop any ongoing TTS or listening
        stopSpeaking();
        isSpeakingRef.current = false;
        setIsSpeaking(false);
        try { recRef.current?.stop(); } catch {}

        // Rewind transcript: keep everything up to (but not including) this prospect turn
        // The advisor's turn right before it stays in the transcript — we just regenerate the prospect's response
        const rewound = transcriptRef.current.slice(0, prospectTurnIndex);
        setTranscript(rewound);
        setCoachSuggestion("");
        // Re-request the prospect's response with retry flag
        await getProspectReply(rewound, true);
      };

      // Advisor retry: rewind transcript to BEFORE this advisor turn so the advisor can speak again.
      // Removes the advisor turn AND any prospect response that came after it.
      const handleAdvisorTryAgain = async (advisorTurnIndex) => {
        if (isThinking || isSpeaking) return;
        // Stop any ongoing TTS or listening
        stopSpeaking();
        isSpeakingRef.current = false;
        setIsSpeaking(false);
        setIsListening(false);
        try { recRef.current?.stop(); } catch {}
        // Clear any in-progress speech segments
        finalSegmentsRef.current = [];
        setInterimText("");
        setCurrentResponseText("");

        // Rewind: keep everything up to (but not including) this advisor turn
        const rewound = transcriptRef.current.slice(0, advisorTurnIndex);
        setTranscript(rewound);
        setCoachSuggestion("");
        // Don't auto-trigger anything — just let the advisor click the mic and try again
      };

      const getCoachSuggestion = async (currentTranscript) => {
        setCoachLoading(true);
        try {
          const lastProspect = [...currentTranscript].reverse().find(t => t.role === "prospect")?.text || "";
          const recent = currentTranscript.slice(-8).map(t => `${t.role === "advisor" ? "ADVISOR" : "PROSPECT"}: ${t.text}`).join("\n");
          const reply = await callGroq({
            apiKey: apiKeyRef.current,
            model: MODEL_COACH,
            messages: [
              { role: "system", content: buildCoachSystemPrompt() },
              { role: "user", content: `RECENT EXCHANGE:\n${recent}\n\nThe prospect just said: "${lastProspect}"\n\nWhat should the advisor say next? Give the actual words the advisor should say. 2–3 sentences max.` }
            ],
            temperature: 0.6,
          });
          setCoachSuggestion(reply.replace(/\*+/g, "").trim());
        } catch (e) {
          console.warn("Coach error", e);
        } finally {
          setCoachLoading(false);
        }
      };

      // Toggle mic
      const toggleMic = () => {
        if (isSpeaking) { stopSpeaking(); isSpeakingRef.current = false; setIsSpeaking(false); }
        setIsListening(l => !l);
      };

      const handleEnd = async () => {
        // Flush any pending response the advisor was in the middle of
        if (finalSegmentsRef.current.length > 0 || (interimText && interimText.trim())) {
          await commitAdvisorTurn();
        }
        stopSpeaking();
        try { recRef.current?.stop(); } catch {}
        setIsListening(false);
        onComplete(transcriptRef.current);
      };

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, "0")}`;
      };

      // Status text
      let statusText = "Tap the mic to start speaking";
      let statusColor = "var(--ink)";
      if (isListening) { statusText = isSpeaking ? "Prospect is speaking…" : "Listening… speak now"; statusColor = "var(--accent)"; }
      if (isThinking) { statusText = "Prospect is thinking…"; statusColor = "var(--gold)"; }
      if (isSpeaking) { statusText = "Prospect is speaking…"; statusColor = "var(--gold)"; }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top bar */}
          <div className="border-b ink-bg px-8 py-4 flex items-center justify-between">
            <div className="flex items-center gap-6">
              <Logo />
              <div className="h-8 w-px bg-white/20"></div>
              <div>
                <div className="text-[10px] uppercase tracking-[0.25em] text-white/70">
                  {mode === "pitch" && "Live pitch"}
                  {mode === "practice" && "Guided practice"}
                  {mode === "curriculum" && "Curriculum drill"}
                </div>
                <div className="text-sm text-white">
                  with {persona.name || "your prospect"}
                  {persona.difficulty && (
                    <span className="ml-2 text-[10px] uppercase tracking-[0.2em] text-white/70">· {persona.difficulty}</span>
                  )}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <div className="text-sm font-mono text-white/70">{formatTime(elapsed)}</div>
              <button onClick={onCancel} className="text-xs uppercase tracking-[0.18em] text-white/60 hover:text-white">Discard</button>
              <button onClick={handleEnd} className="px-5 py-2.5 rounded text-xs uppercase tracking-[0.18em] bg-white text-[var(--teal)] hover:bg-white/90 transition-all font-medium">
                End & Get Report Card
              </button>
            </div>
          </div>

          {/* Curriculum scenario brief */}
          {mode === "curriculum" && persona.focusStep && CURRICULUM_STEPS[persona.focusStep] && (
            <div className="card-warm px-8 py-4 border-b" style={{ borderColor: "var(--rule)", borderRadius: 0 }}>
              <div className="max-w-6xl mx-auto">
                <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--gold)] mb-1">
                  Step {CURRICULUM_STEPS[persona.focusStep].order}: {CURRICULUM_STEPS[persona.focusStep].label}
                </div>
                <div className="text-sm text-[var(--ink)]/80 leading-relaxed">
                  <strong>Scenario:</strong> {CURRICULUM_STEPS[persona.focusStep].scenario}
                </div>
              </div>
            </div>
          )}

          {error && (
            <div className="bg-[var(--accent)] text-white px-8 py-3 text-sm">{error}</div>
          )}

          <div className="flex-1 max-w-6xl w-full mx-auto px-8 py-8 grid lg:grid-cols-3 gap-8">
            {/* Transcript */}
            <div className={mode === "practice" ? "lg:col-span-2" : "lg:col-span-3"}>
              <div className="text-[10px] uppercase tracking-[0.25em] text-[var(--ink)]/50 mb-3">Live transcript</div>
              <div ref={transcriptScrollRef} className="card p-6 h-[480px] overflow-y-auto">
                {transcript.length === 0 && !interimText && (
                  <div className="h-full flex items-center justify-center text-center text-[var(--ink)]/50">
                    <div>
                      <div className="font-display text-xl mb-2">Ready when you are.</div>
                      <p className="text-sm max-w-xs mx-auto">Tap the microphone below and open the meeting. The prospect is waiting for you.</p>
                    </div>
                  </div>
                )}
                <div className="space-y-5">
                  {transcript.map((t, i) => {
                    const isLatestProspect = t.role === "prospect" && i === transcript.length - 1;
                    const showProspectRetry = mode === "practice" && t.role === "prospect" && isLatestProspect && !isThinking && !isSpeaking;

                    // Advisor try-again: only for the *latest* advisor turn that has been responded to
                    // (i.e. it's followed by a prospect turn that is the last turn)
                    const isLatestAdvisorWithReply =
                      t.role === "advisor" &&
                      i === transcript.length - 2 &&
                      transcript[i + 1]?.role === "prospect";
                    const showAdvisorRetry = mode === "practice" && isLatestAdvisorWithReply && !isThinking && !isSpeaking;

                    return (
                      <div key={i} className={`fade-up ${t.role === "advisor" ? "" : "pl-8"}`}>
                        <div className="flex items-center justify-between gap-3 mb-1">
                          <div className={`text-[10px] uppercase tracking-[0.2em] ${t.role === "advisor" ? "text-[var(--ink)]/60" : "text-[var(--gold)]"}`}>
                            {t.role === "advisor" ? "You" : (persona.name || "Prospect")}
                          </div>
                          {showProspectRetry && (
                            <button
                              onClick={() => handleTryAgain(i)}
                              className="text-[10px] uppercase tracking-[0.18em] text-[var(--ink)]/40 hover:text-[var(--gold)] flex items-center gap-1"
                              title="Have the prospect react differently to your same response"
                            >
                              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                              </svg>
                              New Reaction
                            </button>
                          )}
                          {showAdvisorRetry && (
                            <button
                              onClick={() => handleAdvisorTryAgain(i)}
                              className="text-[10px] uppercase tracking-[0.18em] text-[var(--ink)]/40 hover:text-[var(--accent)] flex items-center gap-1"
                              title="Re-do your response — this turn and the prospect's reply will be removed"
                            >
                              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                              </svg>
                              Re-do my response
                            </button>
                          )}
                        </div>
                        <div className={`text-sm leading-relaxed ${t.role === "advisor" ? "text-[var(--ink)]" : "text-[var(--ink)]/80 italic"}`}>
                          {t.text}
                        </div>
                      </div>
                    );
                  })}
                  {/* Live in-progress response — accumulates as advisor speaks */}
                  {(currentResponseText || interimText) && (
                    <div className="card p-4 border-2" style={{ borderColor: "var(--gold)" }}>
                      <div className="text-[10px] uppercase tracking-[0.2em] mb-1.5 text-[var(--gold)]">You (in progress)</div>
                      <div className="text-sm leading-relaxed">
                        <span className="text-[var(--ink)]">{currentResponseText}</span>
                        {interimText && (
                          <span className="text-[var(--ink)]/40 italic">{currentResponseText ? " " : ""}{interimText}</span>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* Mic controls */}
              <div className="mt-8 flex flex-col items-center">
                <div className="text-xs uppercase tracking-[0.2em] mb-4" style={{ color: statusColor }}>{statusText}</div>
                <button
                  onClick={toggleMic}
                  disabled={isThinking || isSpeaking}
                  className={`w-20 h-20 rounded-full flex items-center justify-center relative transition-all ${
                    isListening ? "bg-[var(--accent)] text-white pulse-ring" : "btn-primary"
                  }`}
                  style={{ opacity: (isThinking || isSpeaking) ? 0.5 : 1 }}
                >
                  {isSpeaking ? (
                    <div className="flex items-end gap-1 h-8">
                      {[0,1,2,3,4].map(i => (
                        <div key={i} className="wave-bar w-1 h-full bg-current rounded-full" style={{ transformOrigin: "bottom" }}></div>
                      ))}
                    </div>
                  ) : (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-8 h-8">
                      <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/>
                      <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V21h-2a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-3.07A7 7 0 0 0 19 11z"/>
                    </svg>
                  )}
                </button>
                <div className="text-[11px] text-[var(--ink)]/50 mt-3 text-center max-w-sm">
                  {isSpeaking
                    ? "Prospect speaking…"
                    : isThinking
                      ? "Prospect thinking…"
                      : isListening
                        ? "Take your time — mic stays on until you hit Submit"
                        : "Click to start speaking"}
                </div>

                {/* Submit + Clear buttons — only visible when there's something to submit */}
                {(currentResponseText || interimText) && !isThinking && !isSpeaking && (
                  <div className="mt-6 flex flex-col items-center gap-2 fade-up">
                    <button
                      onClick={commitAdvisorTurn}
                      className="btn-gold px-10 py-4 rounded text-xs uppercase tracking-[0.2em]"
                    >
                      Submit Response →
                    </button>

    const RUBRIC_LABELS = {
      meeting_introduction: "Meeting Introduction",
      profiling: "Profiling the Prospect",
      uncovering_problems: "Uncovering Key Problems / Concerns",
      reviewing_implications: "Reviewing Implications",
      providing_solutions: "Providing Clear Solutions",
      call_to_action: "Call to Action & Next Steps",
      wrap_up: "Meeting Wrap-Up",
    };

    const QUAL_LABELS = {
      cadence: "Cadence",
      conversational_flow: "Conversational Flow",
      format: "Format",
      knowledge: "Knowledge Demonstrated",
      referencing_concerns: "Referencing Client Concerns",
      rapport: "Building Rapport",
      confidence: "Confidence",
      delivery: "Delivery",
    };

    function ScoreBar({ score }) {
      const pct = (score / 10) * 100;
      const color = score >= 8 ? "var(--gold)" : score >= 6 ? "var(--ink)" : "var(--accent)";
      return (
        <div className="flex items-center gap-3">
          <div className="flex-1 h-1.5 rounded-full" style={{ background: "var(--rule)" }}>
            <div className="h-full rounded-full score-bar-fill" style={{ width: `${pct}%`, background: color }}></div>
          </div>
          <div className="font-display text-2xl tabular-nums w-8 text-right" style={{ color }}>{score}</div>
        </div>
      );
